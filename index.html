const normalize = (s) =>
  (s || "")
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/["“”]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();

const parseNumber = (raw) => {
  if (raw === undefined || raw === null) return null;
  let s = raw.toString().trim().replace(/[€\s]/g, "");
  if (s === "" || s === "-" ) return null;
  const hasComma = s.includes(",");
  const hasDot = s.includes(".");
  if (hasComma && hasDot) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (hasComma && !hasDot) {
    s = s.replace(",", ".");
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
};

const fmtEUR = (v) =>
  (v ?? 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const fmtNum = (v) => Math.round(v ?? 0).toLocaleString("es-ES");

function formulaLitros(p) {
  if (!p.gramosHeladoUd || p.litrosHelado <= 0) return null;
  const gramosTotal = p.gramosHeladoUd * p.ud;
  return `${fmtNum(p.ud)} ud × ${fmtNum(p.gramosHeladoUd)} g/ud = ${fmtNum(gramosTotal)} g = ${p.litrosHelado.toFixed(2)} L`;
}
function formulaMaterial(mult, total, ud) {
  if (!mult || total <= 0) return null;
  return `${fmtNum(ud)} ud × ${mult} = ${fmtNum(total)}`;
}
const fmtPct = (v) =>
  v === null || v === undefined || isNaN(v)
    ? "—"
    : v.toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";

function splitLine(line) {
  if (line.includes("\t")) return line.split("\t");
  if (/ {2,}/.test(line)) return line.split(/ {2,}/);
  return line.split(",");
}

// Fila con el layout completo del export de tienda:
// NombreTienda, Categoria, SubCategoria, Producto, TipoIva, Ud, Base, Importe, Peso, Beneficio
// Acepta tanto celdas de texto (pegado) como celdas ya numéricas (lectura de Excel).
function extractFullFormatRow(cells) {
  if (!cells || cells.length < 8) return null;
  const producto = cells[3];
  if (typeof producto !== "string" || !producto.trim()) return null;
  const rawTienda = cells[0];
  const rawUd = cells[5];
  const rawBase = cells[6];
  const rawImporte = cells[7];
  const unidades = typeof rawUd === "number" ? rawUd : parseNumber(rawUd);
  const base = typeof rawBase === "number" ? rawBase : parseNumber(rawBase);
  const importe = typeof rawImporte === "number" ? rawImporte : parseNumber(rawImporte);
  if (importe === null || importe < 0) return null;
  const tienda = typeof rawTienda === "string" && rawTienda.trim() ? rawTienda.trim() : null;
  return { producto: producto.trim(), unidades, base, importe, tienda };
}

function parseWorkbookRows(aoa) {
  let rows = [];
  let skippedLines = [];
  for (const cells of aoa) {
    const r = extractFullFormatRow(cells);
    if (r) {
      rows.push(r);
    } else {
      const raw = (cells || []).filter((c) => c !== null && c !== undefined && c !== "").join(" | ");
      if (raw) skippedLines.push({ texto: raw, motivo: "cabecera, fila vacía o importe negativo" });
    }
  }
  return { rows, skipped: skippedLines.length, skippedLines };
}

// ---------------------------------------------------------------------------
// Parser del archivo de INVENTARIO (formato fijo: INVENTARIO_FORMATO.xlsx)
// Lee por dirección de celda absoluta, ya que es una plantilla de estructura fija.
// ---------------------------------------------------------------------------
function readCellValue(ws, addr) {
  const cell = ws[addr];
  return cell ? cell.v : null;
}

function parseInventarioSheet(ws) {
  const fecha = readCellValue(ws, "D8");
  const subtotal3L = Number(readCellValue(ws, "I17")) || 0;
  const subtotal5L = Number(readCellValue(ws, "N17")) || 0;
  const subtotal7L = Number(readCellValue(ws, "S17")) || 0;
  const totalLitros = subtotal3L + subtotal5L + subtotal7L;
  const macarons = Number(readCellValue(ws, "E28")) || 0;
  const gofres = Number(readCellValue(ws, "J28")) || 0;
  const creps = Number(readCellValue(ws, "O28")) || 0;
  const macaronsGrandiosos = Number(readCellValue(ws, "G39")) || 0;

  // validación mínima: si no hay fecha ni ningún total, probablemente no es este formato
  const valido = fecha !== null || totalLitros > 0 || macarons > 0 || gofres > 0 || creps > 0 || macaronsGrandiosos > 0;

  return { fecha, totalLitros, macarons, gofres, creps, macaronsGrandiosos, valido };
}

// Lee TODAS las pestañas de un libro y devuelve las que tengan formato de inventario válido.
// Así, un único archivo con una pestaña por tienda (sistema de 5 tiendas) se suma automáticamente.
function parseInventarioWorkbook(wb) {
  const sheets = [];
  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    const parsed = parseInventarioSheet(ws);
    if (parsed.valido) sheets.push({ sheetName, parsed });
  }
  return sheets;
}

// Al guardar en storage, las fechas (objetos Date) se serializan como texto JSON;
// al recuperarlas hay que reconstruir los objetos Date para que el resto de la app
// (que usa .toLocaleDateString(), .getTime(), etc.) siga funcionando igual.
function reviveInvFiles(files) {
  return (files || []).map((f) => ({
    ...f,
    sheets: (f.sheets || []).map((s) => ({
      ...s,
      parsed: {
        ...s.parsed,
        fecha: s.parsed && s.parsed.fecha ? new Date(s.parsed.fecha) : null,
      },
    })),
  }));
}

function sumaInventarios(files) {
  // files: [{ fileName, sheets: [{ sheetName, parsed }] }]
  const todasLasHojas = files.flatMap((f) => f.sheets.map((s) => ({ ...s, fileName: f.fileName })));
  const totalLitros = todasLasHojas.reduce((a, s) => a + s.parsed.totalLitros, 0);
  const macarons = todasLasHojas.reduce((a, s) => a + s.parsed.macarons, 0);
  const gofres = todasLasHojas.reduce((a, s) => a + s.parsed.gofres, 0);
  const creps = todasLasHojas.reduce((a, s) => a + s.parsed.creps, 0);
  const macaronsGrandiosos = todasLasHojas.reduce((a, s) => a + s.parsed.macaronsGrandiosos, 0);
  const fechas = todasLasHojas.map((s) => s.parsed.fecha).filter((f) => f instanceof Date);
  const fechaMin = fechas.length ? new Date(Math.min(...fechas.map((f) => f.getTime()))) : null;
  const fechaMax = fechas.length ? new Date(Math.max(...fechas.map((f) => f.getTime()))) : null;
  return { totalLitros, macarons, gofres, creps, macaronsGrandiosos, nHojas: todasLasHojas.length, fechaMin, fechaMax, hojas: todasLasHojas };
}

// ---------------------------------------------------------------------------
// Lectura de FACTURAS DE PROVEEDOR en PDF (p. ej. "-18° SAS"), para "Compras del periodo".
// Carga pdf.js bajo demanda desde cdnjs (no es una librería disponible para import estático).
// ---------------------------------------------------------------------------
let _pdfjsLoadPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsLoadPromise) return _pdfjsLoadPromise;
  _pdfjsLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js";
    script.onload = () => {
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
        resolve(window.pdfjsLib);
      } catch (e) {
        reject(e);
      }
    };
    script.onerror = () => reject(new Error("no se pudo cargar pdf.js desde cdnjs.cloudflare.com"));
    document.head.appendChild(script);
  });
  return _pdfjsLoadPromise;
}

// Extrae el texto de un PDF, reconstruyendo líneas aproximadas por coordenada Y.
// ---------------------------------------------------------------------------
// Lectura de INVENTARIO SEMANAL desde Google Sheets (sin backend, sin login).
// Usa el endpoint público "gviz" de Sheets, que devuelve CSV de un rango de una hoja
// por su nombre — funciona sin autenticación siempre que el documento esté compartido
// como "Cualquier persona con el enlace puede ver". Si no lo está, o si el nombre de la
// pestaña no coincide exactamente, la petición falla y se informa al usuario para que
// use la entrada manual o el archivo en su lugar.
// ---------------------------------------------------------------------------
function parseCsvGrid(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = ""; rows.push(row); row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseNumEs(v) {
  if (v === undefined || v === null || v === "") return 0;
  let s = String(v).trim();
  // El CSV de Google Sheets puede venir con coma decimal (formato de visualización
  // español, "1023,75") o con punto decimal (formato numérico estándar, "1023.75") según
  // el endpoint. Se detectan ambos: si aparecen los dos símbolos, el último es el decimal
  // y el otro se trata como separador de miles; si solo aparece uno, se asume que es el
  // separador decimal salvo que parezca claramente de miles (grupos de 3 dígitos).
  const iComa = s.lastIndexOf(",");
  const iPunto = s.lastIndexOf(".");
  if (iComa !== -1 && iPunto !== -1) {
    if (iComa > iPunto) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (iComa !== -1) {
    s = s.replace(",", ".");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

async function fetchGoogleSheetFull(docId, sheetName) {
  // Se pide un rango explícito y generoso (A1:Z300) en vez de dejar que Google decida el
  // rango automáticamente: un rango explícito fuerza a incluir las filas ocultas (lo
  // confirmamos comparando ambos métodos), mientras que sin rango, Google las omite del
  // CSV — lo que descuadraba los números de fila frente a lo que se ve al abrir la hoja.
  // Se añade "&_=<marca de tiempo>" y "cache: no-store" para evitar que el navegador (o
  // algún proxy intermedio) sirva una respuesta guardada en caché en vez de pedir la
  // versión más reciente de la hoja cada vez que se carga.
  const url = `https://docs.google.com/spreadsheets/d/${docId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&range=A1:Z300&_=${Date.now()}`;
  let resp;
  try {
    resp = await fetch(url, { cache: "no-store" });
  } catch (e) {
    throw new Error("no se pudo conectar con Google Sheets (¿bloqueado por el navegador o sin conexión?)");
  }
  if (!resp.ok) {
    throw new Error(`Google Sheets respondió con error ${resp.status} (revisa que el documento esté compartido como "Cualquier persona con el enlace puede ver")`);
  }
  const text = await resp.text();
  if (text.trim().startsWith("<")) {
    throw new Error(`no se pudo leer la pestaña "${sheetName}" (¿el nombre no coincide exactamente, o el documento no es público?)`);
  }
  return { grid: parseCsvGrid(text), rawText: text };
}

// Interpreta fechas en formato español (día primero): "16/9", "16/9/2026", "16-09-2026"...
// Si no lleva año, usa el año actual. Si no encaja con ese patrón, prueba con el parseo
// nativo del navegador (formatos ISO, etc.) como última opción.
function parseFechaEs(str) {
  if (!str) return null;
  const s = String(str).trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
  if (m) {
    const dia = parseInt(m[1], 10);
    const mes = parseInt(m[2], 10) - 1;
    let anio = m[3] ? parseInt(m[3], 10) : new Date().getFullYear();
    if (anio < 100) anio += 2000;
    const d = new Date(anio, mes, dia);
    if (!isNaN(d.getTime())) return d;
  }
  const d2 = new Date(s);
  return isNaN(d2.getTime()) ? null : d2;
}

// Lee de una pestaña semanal: fecha (C5, o D5 si C5 está vacía y D5 parece una fecha),
// litros (B15), macarons (D24), macarons grandiosos (E24), creps (J24), gofres (K24).
// Se pide la hoja ENTERA (sin "range") y se indexa por posición absoluta, para no depender
// de cómo Google resuelve el parámetro "range" cuando hay celdas combinadas de por medio.
// Busca en toda la rejilla la primera celda cuyo texto (normalizado) cumpla el criterio dado.
// Devuelve {r, c} (índices dentro de la rejilla) o null si no aparece.
function buscarCelda(grid, matcher) {
  for (let r = 0; r < grid.length; r++) {
    const fila = grid[r];
    if (!fila) continue;
    for (let c = 0; c < fila.length; c++) {
      if (matcher((fila[c] || "").toString().trim().toLowerCase())) return { r, c };
    }
  }
  return null;
}

// Busca una columna dentro de UNA fila concreta (no en toda la rejilla) — útil para no
// confundir la cabecera de columna con un título de sección que contenga la misma palabra.
function buscarColumnaEnFila(fila, matcher) {
  if (!fila) return -1;
  for (let c = 0; c < fila.length; c++) {
    if (matcher((fila[c] || "").toString().trim().toLowerCase())) return c;
  }
  return -1;
}

// A partir de una fila de cabecera, busca "Sueltos" en las filas siguientes (hasta 8 filas
// más abajo) y devuelve la fila justo debajo de esa — que es donde va el total. Es más
// robusto que asumir un desplazamiento fijo, por si el número de filas intermedias
// (Cajas/Bandejas/Bolsas) varía de una tienda a otra.
function buscarFilaTotalTrasSueltos(grid, filaCabecera, maxDistancia = 8) {
  for (let r = filaCabecera + 1; r <= filaCabecera + maxDistancia && r < grid.length; r++) {
    const fila = grid[r] || [];
    if (fila.some((v) => (v || "").toString().trim().toLowerCase().includes("suelto"))) {
      return r + 1;
    }
  }
  return filaCabecera + 4; // resguardo si no se encuentra "Sueltos"
}

// Busca una fila que contenga DOS etiquetas distintas a la vez (p. ej. "Macarons" Y
// "Macarons Grandiosos" en la misma fila de cabecera) — necesario porque "MACARONS" también
// aparece solo, como título de sección, en una fila distinta, y una búsqueda simple de
// "macarons" pillaría esa por error al ser la primera que encuentra.
function buscarFilaConDosEtiquetas(grid, matcher1, matcher2) {
  for (let r = 0; r < grid.length; r++) {
    const fila = grid[r];
    if (!fila) continue;
    let c1 = -1, c2 = -1;
    for (let c = 0; c < fila.length; c++) {
      const t = (fila[c] || "").toString().trim().toLowerCase();
      if (c1 === -1 && matcher1(t)) c1 = c;
      if (c2 === -1 && matcher2(t)) c2 = c;
    }
    if (c1 !== -1 && c2 !== -1) return { r, c1, c2 };
  }
  return null;
}

// Lee de una pestaña semanal buscando las etiquetas de texto ("Total Litros", "Macarons",
// "Macarons Grandiosos", "Gofres", "Creps", "Fecha de recuento") en vez de coordenadas fijas,
// y toma los valores en la posición relativa a cada etiqueta. Esto es necesario porque la
// hoja tiene filas ocultas al principio, y el CSV que exporta Google las omite — así que el
// número de fila "visual" (lo que se ve al abrir el documento) no coincide con el número de
// fila que llega aquí. Buscando por contenido, da igual cuántas filas estén ocultas o dónde.
// Aplica toda la extracción (fecha, litros, macarons, gofres, creps) a una rejilla ya
// descargada, y además indica si se ha reconocido AL MENOS una etiqueta — si no se reconoce
// ninguna, lo más probable es que esta rejilla no sea la pestaña correcta (Google puede
// devolver otra pestaña por defecto si el nombre pedido no existe, sin dar ningún error).
function extraerInventarioDeRejilla(grid) {
  const val = (r, c) => (grid[r] && grid[r][c] !== undefined ? grid[r][c] : "");

  let fecha = null;
  const fechaLabel = buscarCelda(grid, (t) => t.includes("fecha de recuento"));
  if (fechaLabel) {
    for (let dc = 1; dc <= 3; dc++) {
      const candidato = val(fechaLabel.r, fechaLabel.c + dc);
      if (candidato && /\d/.test(candidato)) {
        const f = parseFechaEs(candidato);
        if (f) { fecha = f; break; }
      }
    }
  }

  let totalLitros = 0;
  const litrosLabel = buscarCelda(grid, (t) => t.includes("total litros"));
  if (litrosLabel) totalLitros = parseNumEs(val(litrosLabel.r + 1, litrosLabel.c));

  let macarons = 0, macaronsGrandiosos = 0, gofres = 0, creps = 0;
  const filaMacarons = buscarCelda(grid, (t) => t === "macarons");
  if (filaMacarons) {
    const filaTotalMac = buscarFilaTotalTrasSueltos(grid, filaMacarons.r);
    macarons = parseNumEs(val(filaTotalMac, 2));
    macaronsGrandiosos = parseNumEs(val(filaTotalMac, 3));
  }
  // Título "GOFRES Y CREPS" cuando existe; si esta semana no lo tiene (solo trae "MACARONS"
  // y las cuatro cabeceras juntas en la fila de abajo), se busca "Gofres" como cabecera de
  // columna suelta en su lugar — el ancla real es la misma fila en cualquier caso.
  const filaGofresCreps = buscarCelda(grid, (t) => t.includes("gofres") && t.includes("creps"))
    || buscarCelda(grid, (t) => t === "gofres");
  if (filaGofresCreps) {
    const filaTotalGC = buscarFilaTotalTrasSueltos(grid, filaGofresCreps.r);
    gofres = parseNumEs(val(filaTotalGC, 8));
    creps = parseNumEs(val(filaTotalGC, 9));
  }

  const huboAlgunaEtiqueta = !!(fechaLabel || litrosLabel || filaMacarons || filaGofresCreps);
  return { resultado: { totalLitros, macarons, macaronsGrandiosos, creps, gofres, fecha }, huboAlgunaEtiqueta };
}

// Busca el título "SEMANA X DEL MES" dentro de la rejilla y devuelve el número X — sirve
// para comprobar que la pestaña devuelta es de verdad la que se ha pedido, ya que las 4
// semanas comparten exactamente las mismas etiquetas (Fecha de recuento, Total Litros,
// MACARONS...), así que "se ha encontrado alguna etiqueta" no basta para distinguirlas si
// Google devuelve una pestaña equivocada por defecto.
function buscarNumeroSemanaEnTitulo(grid) {
  const c = buscarCelda(grid, (t) => /semana\s*\d+\s*del\s*mes/.test(t));
  if (!c) return null;
  const texto = (grid[c.r][c.c] || "").toString();
  const m = texto.match(/semana\s*(\d+)\s*del\s*mes/i);
  return m ? parseInt(m[1], 10) : null;
}

async function fetchInventarioSemanalGoogleSheet(tienda, semana) {
  const docId = GOOGLE_SHEETS_INVENTARIO[tienda];
  if (!docId) throw new Error(`tienda "${tienda}" no reconocida`);

  const numeroEsperado = (() => {
    const m = semana.match(/semana\s*(\d+)/i);
    return m ? parseInt(m[1], 10) : null;
  })();

  const nombresCandidatos = [semana, ...(SEMANA_NOMBRES_ALTERNATIVOS[semana] || [])];
  const intentos = [];
  for (const nombre of nombresCandidatos) {
    try {
      const { grid, rawText } = await fetchGoogleSheetFull(docId, nombre);
      const numeroEncontrado = buscarNumeroSemanaEnTitulo(grid);
      if (numeroEsperado !== null && numeroEncontrado !== null && numeroEncontrado !== numeroEsperado) {
        // Google ha devuelto la pestaña de OTRA semana (probablemente porque el nombre
        // pedido no coincide exactamente con ninguna pestaña real) — no se acepta, se
        // prueba el siguiente nombre candidato en vez de dar por buenos estos datos.
        intentos.push(`"${nombre}": Google devolvió la pestaña de "Semana ${numeroEncontrado}" en vez de la ${numeroEsperado} pedida`);
        continue;
      }
      const { resultado, huboAlgunaEtiqueta } = extraerInventarioDeRejilla(grid);
      if (huboAlgunaEtiqueta) {
        // Registro siempre en consola (F12 → Console), tanto si sale bien como si los
        // números parecen raros, para poder depurar sin depender de que salte un error.
        try {
          console.log(`[Il Costo] ${tienda} / ${nombre} — CSV crudo (primeros 3000 car.):`, rawText.slice(0, 3000));
        } catch (e) {}
        return resultado;
      }
      intentos.push(`"${nombre}": sin etiquetas reconocibles (primeros 200 car.: ${JSON.stringify(rawText.slice(0, 200))})`);
    } catch (e) {
      intentos.push(`"${nombre}": error — ${e.message}`);
    }
  }
  throw new Error(`no se ha encontrado ninguna pestaña válida para "${semana}" — diagnóstico: ${intentos.join(" · ")}`);
}

async function extractPdfText(file) {
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let fullText = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let lastY = null;
    let line = "";
    const lines = [];
    for (const item of content.items) {
      const y = item.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) {
        lines.push(line);
        line = "";
      }
      line += (line ? " " : "") + item.str;
      lastY = y;
    }
    if (line) lines.push(line);
    fullText += lines.join("\n") + "\n";
  }
  // Notas de pie de línea (certificación bio, contribución Eco-Emballage...) a veces aparecen
  // en el PDF entre el nombre del producto y las cifras de esa misma fila (el orden interno de
  // los objetos de texto del PDF no siempre coincide con el orden visual de lectura), lo que
  // rompe el patrón "producto ... cantidad ... precio" de una línea. Se eliminan del texto
  // completo (antes de trocearlo en líneas) para que la fila del producto quede intacta.
  fullText = fullText
    .replace(/Produit\s+issu\s+de\s+l['’]agriculture\s+biologique,?\s*certifi[ée]\s*par\s*Ecocert\s*FR-?BIO-?0?1\.?/gi, " ")
    .replace(/Prix\s+incluant\s+la\s+contribution\s+Eco-?Emballage\.?/gi, " ");
  return fullText;
}

// Interpreta el texto de una factura de proveedor: detecta líneas de helado (litros),
// macarons y gofres/creps (cajas), a partir del formato visto en las facturas de "-18° SAS".
// Cantidad (Qté) se distingue del resto de importes porque usa punto decimal (10.00),
// mientras que los precios usan coma decimal (36,44) — es la pista más fiable de la línea.
function parseFacturaText(text) {
  const rawLines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  // El renderizado del PDF a veces parte una fila en varias líneas: una nota de pie
  // (certificación bio) o el propio formato de caja "(8x10ud)" pueden quedar solos, separados
  // del nombre del producto y/o de sus cifras. Aquí se recompone: una línea que es solo un
  // paréntesis "(...)", o que empieza directamente por el patrón "cantidad precio" (sin código
  // de referencia delante), se pega a la línea anterior mientras ésta siga sin sus cifras.
  const lines = [];
  for (const raw of rawLines) {
    const esNumerosHuerfanos = /^\d+\.\d{2}\s+\d+,\d{2}/.test(raw);
    const esParentesisSuelto = /^\([^()]*\)$/.test(raw);
    if ((esNumerosHuerfanos || esParentesisSuelto) && lines.length > 0 && !/\d+\.\d{2}\s+\d+,\d{2}/.test(lines[lines.length - 1])) {
      lines[lines.length - 1] = lines[lines.length - 1] + " " + raw;
    } else {
      lines.push(raw);
    }
  }
  const detected = [];
  const ignoradas = [];
  const noReconocidas = [];

  for (const line of lines) {
    if (/TRANSGT|freight|transport/i.test(line)) {
      ignoradas.push(line);
      continue;
    }
    let m = line.match(/^(\S+)\s+(.+?)\s+(\d+\.\d{2})\s+(\d+,\d{2})/);
    if (!m) {
      // Segundo intento: si queda algún resto de texto delante de la línea (p. ej. de una nota
      // de pie mal encajada), busca el patrón en cualquier posición, no solo al principio.
      m = line.match(/(\S+)\s+(.+?)\s+(\d+\.\d{2})\s+(\d+,\d{2})/);
    }
    if (!m) continue;
    const referencia = m[1];
    const designacion = m[2];
    const cantidad = parseFloat(m[3]);
    if (!cantidad) continue;

    // El proveedor tiene una errata recurrente en algunas líneas ("5 ltiros" en vez de
    // "5 litros", vista repetidamente en $CHEESEM5) — se acepta también esa variante para
    // no perder la línea entera en silencio.
    const mLitros = designacion.match(/(\d+(?:[.,]\d+)?)\s*(?:litros?|litres?|ltiros?)/i);
    const mBox = designacion.match(/\((\d+)\s*x\s*(\d+)\s*(?:ud|pz|p)\)/i);
    const mUd = designacion.match(/\((\d+)\s*(?:ud|pz|p)\)/i);
    const esGrandioso = /grandios/i.test(designacion);
    const refUp = referencia.toUpperCase();
    // Solo se consideran macarons/gofres/creps si el CÓDIGO empieza por el prefijo del
    // producto real — así los accesorios/consumibles que solo mencionan la palabra en el
    // texto libre (cajas vacías, tenedores, cremas... "para gofres y crepes") no se cuelan.
    const esCodigoMacaron = refUp.startsWith("MAC") && !refUp.startsWith("MACBOX");
    const esCodigoGofre = refUp.startsWith("GAUFRE");
    const esCodigoCrep = refUp.startsWith("CREPE");

    let categoria = null, valor = null, detalle = "";
    if (mLitros) {
      const tam = parseFloat(mLitros[1].replace(",", "."));
      categoria = "litrosHelado";
      valor = cantidad * tam;
      detalle = `${cantidad} × ${tam} L`;
    } else if (esCodigoMacaron && esGrandioso && mBox) {
      categoria = "macaronsGrandiosos";
      valor = cantidad * parseInt(mBox[1], 10) * parseInt(mBox[2], 10);
      detalle = `${cantidad} caja(s) × ${mBox[1]}×${mBox[2]} ud.`;
    } else if (esCodigoMacaron && mBox) {
      categoria = "macarons";
      valor = cantidad * parseInt(mBox[1], 10) * parseInt(mBox[2], 10);
      detalle = `${cantidad} caja(s) × ${mBox[1]}×${mBox[2]} ud.`;
    } else if (esCodigoGofre && mUd) {
      categoria = "gofres";
      valor = cantidad * parseInt(mUd[1], 10);
      detalle = `${cantidad} caja(s) × ${mUd[1]} ud.`;
    } else if (esCodigoCrep && mBox) {
      categoria = "creps";
      valor = cantidad * parseInt(mBox[1], 10) * parseInt(mBox[2], 10);
      detalle = `${cantidad} caja(s) × ${mBox[1]}×${mBox[2]} ud.`;
    } else if (esCodigoCrep && mUd) {
      categoria = "creps";
      valor = cantidad * parseInt(mUd[1], 10);
      detalle = `${cantidad} caja(s) × ${mUd[1]} ud.`;
    } else if (esCodigoMacaron || esCodigoGofre || esCodigoCrep) {
      // el código SÍ es de un producto real de estas familias, pero no hemos podido
      // extraer el formato de caja (p. ej. una variante de texto que no hemos visto aún)
      noReconocidas.push({ referencia, designacion, cantidad });
      continue;
    } else {
      continue;
    }
    detected.push({ referencia, designacion, cantidad, categoria, valor, detalle });
  }

  const totales = { litrosHelado: 0, macarons: 0, macaronsGrandiosos: 0, gofres: 0, creps: 0 };
  for (const d of detected) totales[d.categoria] += d.valor;

  return { detected, ignoradas, noReconocidas, totales };
}

function parseSalesInput(text) {
  const lines = text.split("\n").map((l) => l.replace(/\r/, "")).filter((l) => l.trim() !== "");
  const rows = [];
  const skippedLines = [];
  for (const line of lines) {
    let cells = splitLine(line).map((c) => c.trim());

    // Formato completo del export de tienda (10 columnas)
    if (cells.length >= 9) {
      const r = extractFullFormatRow(cells);
      if (r) rows.push(r);
      else skippedLines.push({ texto: line, motivo: "cabecera, fila vacía o importe negativo" });
      continue;
    }

    // Formato simplificado: Producto, [Unidades,] Importe
    cells = cells.filter((c, i) => !(i > 0 && c === "" && cells.length > 3));
    if (cells.length < 2) { skippedLines.push({ texto: line, motivo: "menos de 2 columnas" }); continue; }
    if (HEADER_WORDS.some((w) => normalize(cells[0]).includes(w))) { skippedLines.push({ texto: line, motivo: "fila de cabecera" }); continue; }

    let producto, unidades = null, importe = null;
    if (cells.length >= 3) {
      producto = cells[0];
      unidades = parseNumber(cells[1]);
      importe = parseNumber(cells[cells.length - 1]);
    } else {
      producto = cells[0];
      importe = parseNumber(cells[1]);
    }
    if (!producto || importe === null) { skippedLines.push({ texto: line, motivo: "no se ha podido interpretar el importe" }); continue; }
    if (importe < 0) { skippedLines.push({ texto: line, motivo: "importe negativo (devolución/anulación)" }); continue; }
    rows.push({ producto, unidades, importe });
  }
  return { rows, skipped: skippedLines.length, skippedLines };
}

// Desglose de ingredientes de un producto (escandallo completo), usado como fila expandible
// en las listas de "Imputación" y de consumo de materias primas.

  if (!detalle) {
    return (
      <tr>
        <td colSpan={colSpan} style={{ padding: "10px 14px", background: "#FAFAF9", fontSize: 12, color: "#9CA3AF", fontStyle: "italic" }}>
          No hay escandallo desglosado disponible para este producto.
        </td>
      </tr>

  }
  return (
    <tr>
      <td colSpan={colSpan} style={{ padding: "10px 14px 14px", background: "#FAFAF9" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11.5 }}>
          <thead>
            <tr style={{ color: "#78716C", textAlign: "left", borderBottom: "1px solid #E5E0D5" }}>
              <th style={{ padding: "4px 8px", fontWeight: 600 }}>Ingrediente</th>
              <th style={{ padding: "4px 8px", fontWeight: 600, textAlign: "right" }}>Cantidad</th>
              <th style={{ padding: "4px 8px", fontWeight: 600, textAlign: "right" }}>Coste/ud.</th>
              <th style={{ padding: "4px 8px", fontWeight: 600, textAlign: "right" }}>Coste total</th>
            </tr>
          </thead>
          <tbody>
            {detalle.ingredientes.map((ing, i) => (
              <tr key={i} style={{ borderBottom: "1px solid #F1EBDD" }}>
                <td style={{ padding: "4px 8px" }}>{ing.ingrediente}</td>
                <td style={{ padding: "4px 8px", textAlign: "right", color: "#78716C" }}>
                  {ing.cantidad !== null ? `${ing.cantidad} ${ing.unidad || ""}` : "—"}
                </td>
                <td style={{ padding: "4px 8px", textAlign: "right", color: "#78716C" }}>
                  {ing.costeUnidad !== null ? fmtEUR(ing.costeUnidad) : "—"}
                </td>
                <td style={{ padding: "4px 8px", textAlign: "right", fontWeight: 600 }}>
                  {ing.costeTotal !== null ? fmtEUR(ing.costeTotal) : "—"}
                </td>
              </tr>
            ))}
            <tr>
              <td colSpan={3} style={{ padding: "5px 8px", textAlign: "right", fontWeight: 700 }}>Coste total del producto</td>
              <td style={{ padding: "5px 8px", textAlign: "right", fontWeight: 700 }}>{fmtEUR(detalle.costeTotal)}</td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  );
}

// ---------------------------------------------------------------------------
// Almacenamiento persistente: localStorage del navegador (versión standalone).
// En el artefacto de Claude.ai se usa window.storage; aquí, fuera de ese
// entorno, usamos localStorage con la misma interfaz mínima que necesitamos.
// ---------------------------------------------------------------------------
const storage = {
  async get(key) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw === null ? null : { value: raw };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

  const [showGofres, setShowGofres] = useState(false);
  const [showCreps, setShowCreps] = useState(false);
  const [expandedKey, setExpandedKey] = useState(null);
  const [showTodosProductos, setShowTodosProductos] = useState(true);
  const [soloTotalesProductos, setSoloTotalesProductos] = useState(false);
  const [showResultadosPrincipales, setShowResultadosPrincipales] = useState(true);
  const [showLitrosHeladoSection, setShowLitrosHeladoSection] = useState(true);
  const [panelesAbiertos, setPanelesAbiertos] = useState({}); // { [producto]: { tienda: bool, escandallo: bool } }
  const togglePanel = (producto, panel) => {

  const handleExportarProductosExcel = () => {
    if (!productosConsolidados) return;
    const cabecera = [
      "Producto", "Unidades vendidas",
      "Gramos helado / ud", "Litros helado (total)",

      "Gofres / ud", "Gofres (total)",
      "Creps / ud", "Creps (total)",

    const filas = productosConsolidados.lista.map((p) => [

    ]);
    const filaTotal = [

    const aoa = [cabecera, ...filas, filaTotal];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = cabecera.map((h) => ({ wch: Math.max(12, h.length) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Todos los productos");
    const fecha = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `il_costo_todos_los_productos_${fecha}.xlsx`);

  const [colVisibles, setColVisibles] = useState({
    litrosHelado: true, macarons: true, macaronsGrandiosos: true, gofres: true, creps: true, base: true, importe: false,
  });
  const [colAcumVisibles, setColAcumVisibles] = useState({
    litrosHelado: true, macarons: true, macaronsGrandiosos: true, gofres: true, creps: true,
  });
  const [customAliases, setCustomAliases] = useState({});
  const [ratioOverrides, setRatioOverrides] = useState({});
  const [showEscandallos, setShowEscandallos] = useState(false);
  const [escandalloFilter, setEscandalloFilter] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [saveNote, setSaveNote] = useState("");

  // Cargar equivalencias, ajustes, inventarios y facturas guardados
  useEffect(() => {
    (async () => {
      try {
        const a = await storage.get("custom_aliases", false);
        if (a && a.value) setCustomAliases(JSON.parse(a.value));
      } catch (e) {}
      try {
        const r = await storage.get("ratio_overrides", false);
        if (r && r.value) setRatioOverrides(JSON.parse(r.value));
      } catch (e) {}
      try {
        const im = await storage.get("il_costo_inv_inicial_manual", false);
        if (im && im.value) setInvInicialManual(JSON.parse(im.value));
      } catch (e) {}
      try {
        const fm = await storage.get("il_costo_inv_final_manual", false);
        if (fm && fm.value) setInvFinalManual(JSON.parse(fm.value));
      } catch (e) {}
      try {
        const ifiles = await storage.get("il_costo_inv_inicial_files", false);
        if (ifiles && ifiles.value) setInvInicialFiles(reviveInvFiles(JSON.parse(ifiles.value)));
      } catch (e) {}
      try {
        const ffiles = await storage.get("il_costo_inv_final_files", false);

      } catch (e) {}
      try {
        const facts = await storage.get("il_costo_facturas_confirmadas", false);

        if (c && c.value) setCompras(JSON.parse(c.value));

      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    storage.set("il_costo_compras", JSON.stringify(compras), false).catch(() => {});
  }, [compras, loaded]);

  // Guardar automáticamente inventarios (manual + archivos) y facturas confirmadas cuando cambian.
  // Se salta el primer render (antes de que termine de cargar lo persistido) para no sobrescribir con vacío.
  useEffect(() => {
    if (!loaded) return;
    storage.set("il_costo_inv_inicial_manual", JSON.stringify(invInicialManual), false).catch(() => {});
  }, [invInicialManual, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("il_costo_inv_final_manual", JSON.stringify(invFinalManual), false).catch(() => {});
  }, [invFinalManual, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("il_costo_inv_inicial_files", JSON.stringify(invInicialFiles), false).catch(() => {});
  }, [invInicialFiles, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("il_costo_inv_final_files", JSON.stringify(invFinalFiles), false).catch(() => {});
  }, [invFinalFiles, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("il_costo_facturas_confirmadas", JSON.stringify(facturasConfirmadas), false).catch(() => {});
  }, [facturasConfirmadas, loaded]);

  const persistAliases = useCallback(async (next) => {
    setCustomAliases(next);
    try {
      await storage.set("custom_aliases", JSON.stringify(next), false);
    } catch (e) {}
  }, []);

  const persistOverrides = useCallback(async (next) => {
    setRatioOverrides(next);
    try {
      await storage.set("ratio_overrides", JSON.stringify(next), false);
    } catch (e) {}
  }, []);

  // Índice de escandallos por nombre normalizado (con overrides de ratio aplicados)
  const escandalloIndex = useMemo(() => {
    const idx = {};
    for (const e of ESCANDALLOS_BASE) {
      const ratio = ratioOverrides[e.producto] !== undefined ? ratioOverrides[e.producto] : e.ratio;
      idx[normalize(e.producto)] = { producto: e.producto, ratio };
    }
    return idx;
  }, [ratioOverrides]);

  const resolveProduct = useCallback(
    (nombre) => {
      const n = normalize(nombre);
      if (escandalloIndex[n]) return escandalloIndex[n];
      if (customAliases[n] && escandalloIndex[normalize(customAliases[n])]) {
        return escandalloIndex[normalize(customAliases[n])];
      }
      if (ALIASES[n] && escandalloIndex[normalize(ALIASES[n])]) {
        return escandalloIndex[normalize(ALIASES[n])];
      }
      return null;
    },
    [escandalloIndex, customAliases]
  );

  // Índice de gramos de helado por producto (dato fijo, sin overrides por ahora)
  const heladoIndex = useMemo(() => {
    const idx = {};
    for (const h of GRAMOS_HELADO_BASE) {
      idx[normalize(h.producto)] = { producto: h.producto, gramos: h.gramos };
    }
    return idx;
  }, []);

  const resolveHelado = useCallback(
    (nombre) => {
      const n = normalize(nombre);
      if (heladoIndex[n]) return heladoIndex[n];
      if (ALIASES_HELADO[n] && heladoIndex[normalize(ALIASES_HELADO[n])]) {
        return heladoIndex[normalize(ALIASES_HELADO[n])];
      }
      return null;
    },
    [heladoIndex]
  );

  const proporcionIndex = useMemo(() => {
    const idx = {};
    for (const p of PROPORCION_HELADO_BASE) {
      idx[normalize(p.producto)] = { producto: p.producto, proporcion: p.proporcion };
    }
    return idx;
  }, []);

  const resolveProporcion = useCallback(
    (nombre) => {
      const n = normalize(nombre);
      if (proporcionIndex[n]) return proporcionIndex[n];
      if (ALIASES_HELADO[n] && proporcionIndex[normalize(ALIASES_HELADO[n])]) {
        return proporcionIndex[normalize(ALIASES_HELADO[n])];
      }
      return null;
    },
    [proporcionIndex]
  );

  const resolveMaterial = (dict, nombre) => {
    const n = normalize(nombre);
    return dict[n] !== undefined ? dict[n] : null;
  };

  const detalleIndex = useMemo(() => {
    const idx = {};
    for (const key of Object.keys(ESCANDALLO_DETALLE)) {
      idx[normalize(key)] = key;
    }
    return idx;
  }, []);

  // Resolución en capas: coincidencia directa -> ALIASES_HELADO -> ALIASES_DETALLE -> ALIASES (coste)
  const resolveDetalle = useCallback(
    (nombre) => {
      const n = normalize(nombre);
      if (detalleIndex[n]) return ESCANDALLO_DETALLE[detalleIndex[n]];
      const candidatos = [ALIASES_HELADO[n], ALIASES_DETALLE[n], ALIASES[n]].filter(Boolean);
      for (const c of candidatos) {
        const cn = normalize(c);
        if (detalleIndex[cn]) return ESCANDALLO_DETALLE[detalleIndex[cn]];
      }
      return null;
    },
    [detalleIndex]
  );

  const results = useMemo(() => {
    if (!parsedRows) return null;
    const rows = parsedRows.map((r) => {
      const match = resolveProduct(r.producto);
      const coste = match ? r.importe * match.ratio : null;
      const heladoMatch = resolveHelado(r.producto);
      const gramosHeladoUd = heladoMatch ? heladoMatch.gramos : 0;
      const gramosHeladoTotal = heladoMatch && r.unidades !== null ? heladoMatch.gramos * r.unidades : null;
      const proporcionMatch = resolveProporcion(r.producto);
      const importeImputadoHelado = proporcionMatch ? r.importe * proporcionMatch.proporcion : null;
      const macaronsUd = resolveMaterial(MATERIAL_MACARONS, r.producto);
      const macaronsGrandiososUd = resolveMaterial(MATERIAL_MACARONS_GRANDIOSOS, r.producto);
      const gofresUd = resolveMaterial(MATERIAL_GOFRES, r.producto);
      const crepsUd = resolveMaterial(MATERIAL_CREPS, r.producto);
      return {
        ...r,
        match,
        ratioPct: match ? match.ratio * 100 : null,
        coste,
        heladoMatch,
        gramosHeladoUd,
        gramosHeladoTotal,
        proporcionMatch,
        importeImputadoHelado,
        macaronsUd, macaronsGrandiososUd, gofresUd, crepsUd,
      };
    });
    rows.sort((a, b) => (b.importe || 0) - (a.importe || 0));
    const totalImporte = rows.reduce((a, r) => a + (r.importe || 0), 0);
    const matchedRows = rows.filter((r) => r.match);
    const importeConCoste = matchedRows.reduce((a, r) => a + r.importe, 0);
    const costeTotal = matchedRows.reduce((a, r) => a + r.coste, 0);
    const cobertura = totalImporte > 0 ? (importeConCoste / totalImporte) * 100 : 0;
    const ratioMedio = importeConCoste > 0 ? (costeTotal / importeConCoste) * 100 : null;
    const unmatchedCount = rows.length - matchedRows.length;

    // Litros de helado: solo se pueden sumar las líneas que tienen unidades (no basta con el importe)
    const heladoRows = rows.filter((r) => r.heladoMatch && r.gramosHeladoUd > 0);
    const heladoConUnidades = heladoRows.filter((r) => r.gramosHeladoTotal !== null);
    const heladoSinUnidades = heladoRows.filter((r) => r.gramosHeladoTotal === null);
    const gramosHeladoTotal = heladoConUnidades.reduce((a, r) => a + r.gramosHeladoTotal, 0);
    const litrosHelado = gramosHeladoTotal / 880;

    // Imputación de facturación a helado (transparencia)
    const imputacionRows = rows.filter((r) => r.proporcionMatch && r.importeImputadoHelado > 0)
      .sort((a, b) => b.importeImputadoHelado - a.importeImputadoHelado);
    const totalImputadoHelado = imputacionRows.reduce((a, r) => a + r.importeImputadoHelado, 0);

    // Consumo teórico de materias primas base (para Coste Real)
    function sumMaterial(key) {
      const conUnidades = rows.filter((r) => r[key] !== null && r.unidades !== null);
      const sinUnidades = rows.filter((r) => r[key] !== null && r.unidades === null);
      const total = conUnidades.reduce((a, r) => a + r[key] * r.unidades, 0);
      return { total, conUnidades, sinUnidades };
    }
    const consumoTeoricoMacarons = sumMaterial("macaronsUd");
    const consumoTeoricoMacaronsGrandiosos = sumMaterial("macaronsGrandiososUd");
    const consumoTeoricoGofres = sumMaterial("gofresUd");
    const consumoTeoricoCreps = sumMaterial("crepsUd");

    // Facturación de cada "familia de materia prima" en el periodo (todos los productos que
    // llevan esa materia prima, tengan o no unidades registradas), para calcular % de consumo sobre venta.
    function familiaImporte(matchKey) {
      return rows.filter((r) => r[matchKey] !== null && r[matchKey] !== undefined).reduce((a, r) => a + r.importe, 0);
    }
    const ventaFamiliaHelado = rows.filter((r) => r.proporcionMatch).reduce((a, r) => a + r.importe, 0);
    const ventaFamiliaMacarons = familiaImporte("macaronsUd");
    const ventaFamiliaMacaronsGrandiosos = familiaImporte("macaronsGrandiososUd");
    const ventaFamiliaGofres = familiaImporte("gofresUd");
    const ventaFamiliaCreps = familiaImporte("crepsUd");

    return {
      rows, totalImporte, importeConCoste, costeTotal, cobertura, ratioMedio, unmatchedCount,
      heladoRows: heladoConUnidades.sort((a, b) => b.gramosHeladoTotal - a.gramosHeladoTotal),
      heladoSinUnidades,
      gramosHeladoTotal, litrosHelado,
      imputacionRows, totalImputadoHelado,
      consumoTeoricoMacarons, consumoTeoricoMacaronsGrandiosos, consumoTeoricoGofres, consumoTeoricoCreps,
      ventaFamiliaHelado, ventaFamiliaMacarons, ventaFamiliaMacaronsGrandiosos, ventaFamiliaGofres, ventaFamiliaCreps,
    };
  }, [parsedRows, resolveProduct, resolveHelado, resolveProporcion]);

  // Tabla "Todos los productos": fusiona el mismo producto de todas las tiendas/archivos
  // subidos en una sola fila, con el desglose por tienda guardado aparte para el desplegable.
  const productosConsolidados = useMemo(() => {
    if (!results) return null;
    const porProducto = new Map();
    for (const r of results.rows) {
      const key = r.producto;
      if (!porProducto.has(key)) {
        porProducto.set(key, {
          producto: key,
          ud: 0, base: 0, baseTieneDatos: false, importe: 0,
          litrosHelado: 0, macarons: 0, macaronsGrandiosos: 0, gofres: 0, creps: 0,
          gramosHeladoUd: r.heladoMatch ? r.gramosHeladoUd : null,
          macaronsMult: r.macaronsUd,
          macaronsGrandiososMult: r.macaronsGrandiososUd,
          gofresMult: r.gofresUd,
          crepsMult: r.crepsUd,
          sinEscandallo: !r.match,
          escandalloDetalle: resolveDetalle(r.producto),
          porTienda: new Map(),
        });
      }
      const acc = porProducto.get(key);
      const ud = r.unidades || 0;
      const litros = r.gramosHeladoTotal !== null && r.gramosHeladoTotal !== undefined ? r.gramosHeladoTotal / 880 : 0;
      const macarons = r.macaronsUd !== null && r.unidades !== null ? r.macaronsUd * r.unidades : 0;
      const macaronsG = r.macaronsGrandiososUd !== null && r.unidades !== null ? r.macaronsGrandiososUd * r.unidades : 0;
      const gofres = r.gofresUd !== null && r.unidades !== null ? r.gofresUd * r.unidades : 0;
      const creps = r.crepsUd !== null && r.unidades !== null ? r.crepsUd * r.unidades : 0;

      acc.ud += ud;
      if (r.base !== null && r.base !== undefined) { acc.base += r.base; acc.baseTieneDatos = true; }
      acc.importe += r.importe || 0;
      acc.litrosHelado += litros;
      acc.macarons += macarons;
      acc.macaronsGrandiosos += macaronsG;
      acc.gofres += gofres;
      acc.creps += creps;

      const tiendaKey = r.tienda || "(sin identificar)";
      if (!acc.porTienda.has(tiendaKey)) {
        acc.porTienda.set(tiendaKey, { tienda: tiendaKey, ud: 0, base: 0, baseTieneDatos: false, importe: 0, litrosHelado: 0, macarons: 0, macaronsGrandiosos: 0, gofres: 0, creps: 0 });
      }
      const t = acc.porTienda.get(tiendaKey);
      t.ud += ud;
      if (r.base !== null && r.base !== undefined) { t.base += r.base; t.baseTieneDatos = true; }
      t.importe += r.importe || 0;
      t.litrosHelado += litros;
      t.macarons += macarons;
      t.macaronsGrandiosos += macaronsG;
      t.gofres += gofres;
      t.creps += creps;
    }
    const lista = Array.from(porProducto.values()).map((p) => ({ ...p, porTienda: Array.from(p.porTienda.values()).sort((a, b) => b.importe - a.importe) }));
    lista.sort((a, b) => {
      const aConsume = a.litrosHelado + a.macarons + a.macaronsGrandiosos + a.gofres + a.creps > 0;
      const bConsume = b.litrosHelado + b.macarons + b.macaronsGrandiosos + b.gofres + b.creps > 0;
      if (aConsume !== bConsume) return aConsume ? -1 : 1;
      return b.importe - a.importe;
    });
    // Acumulado corrido según el orden en que se muestran las filas (de arriba abajo),
    // para que cada fila pueda mostrar "voy por X" hasta llegar al total en la última.
    let acLitros = 0, acMacarons = 0, acMacaronsG = 0, acGofres = 0, acCreps = 0;
    for (const p of lista) {
      acLitros += p.litrosHelado;
      acMacarons += p.macarons;
      acMacaronsG += p.macaronsGrandiosos;
      acGofres += p.gofres;
      acCreps += p.creps;
      p.acumLitrosHelado = acLitros;
      p.acumMacarons = acMacarons;
      p.acumMacaronsGrandiosos = acMacaronsG;
      p.acumGofres = acGofres;
      p.acumCreps = acCreps;
    }
    const sinEscandalloCount = lista.filter((p) => p.sinEscandallo).length;
    const totales = lista.reduce(
      (a, p) => ({
        ud: a.ud + p.ud,
        base: a.base + p.base,
        baseTieneDatos: a.baseTieneDatos || p.baseTieneDatos,
        importe: a.importe + p.importe,
        litrosHelado: a.litrosHelado + p.litrosHelado,
        macarons: a.macarons + p.macarons,
        macaronsGrandiosos: a.macaronsGrandiosos + p.macaronsGrandiosos,
        gofres: a.gofres + p.gofres,
        creps: a.creps + p.creps,
      }),
      { ud: 0, base: 0, baseTieneDatos: false, importe: 0, litrosHelado: 0, macarons: 0, macaronsGrandiosos: 0, gofres: 0, creps: 0 }
    );
    return { lista, sinEscandalloCount, totales };
  }, [results, resolveDetalle]);

  function combineInventario(files, manual) {
    const agg = files.length
      ? sumaInventarios(files)
      : { totalLitros: 0, macarons: 0, gofres: 0, creps: 0, macaronsGrandiosos: 0, nHojas: 0, fechaMin: null, fechaMax: null, hojas: [] };
    const manualActive = Object.values(manual).some((v) => Number(v) > 0);
    if (files.length === 0 && !manualActive) return null;
    return {
      totalLitros: agg.totalLitros + (Number(manual.totalLitros) || 0),
      macarons: agg.macarons + (Number(manual.macarons) || 0),
      gofres: agg.gofres + (Number(manual.gofres) || 0),
      creps: agg.creps + (Number(manual.creps) || 0),
      macaronsGrandiosos: agg.macaronsGrandiosos + (Number(manual.macaronsGrandiosos) || 0),
      nHojas: agg.nHojas,
      fechaMin: agg.fechaMin,
      fechaMax: agg.fechaMax,
      hojas: agg.hojas,
      manualActive,
    };
  }

  const invInicial = useMemo(
    () => combineInventario(invInicialFiles, invInicialManual),
    [invInicialFiles, invInicialManual]
  );
  const invFinal = useMemo(
    () => combineInventario(invFinalFiles, invFinalManual),
    [invFinalFiles, invFinalManual]
  );

  const costeReal = useMemo(() => {
    if (!results || !invInicial || !invFinal) return null;

    const consumoRealLitros = invInicial.totalLitros + Number(compras.litrosHelado || 0) - invFinal.totalLitros;
    const consumoRealMacarons = invInicial.macarons + Number(compras.macarons || 0) - invFinal.macarons;
    const consumoRealMacaronsGrandiosos = invInicial.macaronsGrandiosos + Number(compras.macaronsGrandiosos || 0) - invFinal.macaronsGrandiosos;
    const consumoRealGofres = invInicial.gofres + Number(compras.gofres || 0) - invFinal.gofres;
    const consumoRealCreps = invInicial.creps + Number(compras.creps || 0) - invFinal.creps;

    function compara(real, teorico, precioUnitario, ventaFamilia) {
      const delta = real - teorico;
      const deltaPct = teorico !== 0 ? (delta / teorico) * 100 : null;
      const consumoRealEuros = real * precioUnitario;
      const consumoTeoricoEuros = teorico * precioUnitario;
      const pctSobreVentaGlobal = results.totalImporte > 0 ? (consumoRealEuros / results.totalImporte) * 100 : null;
      const pctSobreVentaFamilia = ventaFamilia > 0 ? (consumoRealEuros / ventaFamilia) * 100 : null;
      const pctTeoricoSobreVentaGlobal = results.totalImporte > 0 ? (consumoTeoricoEuros / results.totalImporte) * 100 : null;
      const pctTeoricoSobreVentaFamilia = ventaFamilia > 0 ? (consumoTeoricoEuros / ventaFamilia) * 100 : null;
      return {
        real, teorico, delta, deltaPct, consumoRealEuros, pctSobreVentaGlobal, pctSobreVentaFamilia,
        consumoTeoricoEuros, pctTeoricoSobreVentaGlobal, pctTeoricoSobreVentaFamilia, ventaFamilia,
      };
    }

    return {
      litros: compara(consumoRealLitros, results.litrosHelado, PRECIO_UNITARIO.litros, results.ventaFamiliaHelado),
      macarons: compara(consumoRealMacarons, results.consumoTeoricoMacarons.total, PRECIO_UNITARIO.macarons, results.ventaFamiliaMacarons),
      macaronsGrandiosos: compara(consumoRealMacaronsGrandiosos, results.consumoTeoricoMacaronsGrandiosos.total, PRECIO_UNITARIO.macaronsGrandiosos, results.ventaFamiliaMacaronsGrandiosos),
      gofres: compara(consumoRealGofres, results.consumoTeoricoGofres.total, PRECIO_UNITARIO.gofres, results.ventaFamiliaGofres),
      creps: compara(consumoRealCreps, results.consumoTeoricoCreps.total, PRECIO_UNITARIO.creps, results.ventaFamiliaCreps),
    };
  }, [results, invInicial, invFinal, compras]);

  const handleCalcular = () => {
    if (!selectedTienda) {
      setTiendaWarning(true);
      return;
    }
    setTiendaWarning(false);
    setFileName("");
    setFileError("");
    const { rows, skipped, skippedLines } = parseSalesInput(rawInput);
    if (rows.length === 0) return;
    setParsedRows((prev) => (prev ? [...prev, ...rows] : rows));
    setSkippedCount((prev) => prev + skipped);
    setSkippedLinesList((prev) => [...prev, ...skippedLines.map((s) => ({ ...s, fuente: "Pegado manual" }))]);
    setVentasFuentes((prev) => [...prev, { label: `Pegado manual (${rows.length} líneas)`, n: rows.length }]);
    setRawInput("");
  };

  const handleFileUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    if (!selectedTienda) {
      setTiendaWarning(true);
      e.target.value = "";
      return;
    }
    setTiendaWarning(false);
    setFileError("");

    const nuevasFilas = [];
    const nuevasFuentes = [];
    const erroresArchivo = [];
    let totalSkipped = 0;
    const nuevasSkippedLines = [];

    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
        const { rows, skipped, skippedLines } = parseWorkbookRows(aoa);
        if (rows.length === 0) {
          erroresArchivo.push(`${file.name}: no se han encontrado filas válidas (¿formato correcto?)`);
          continue;
        }
        nuevasFilas.push(...rows);
        totalSkipped += skipped;
        nuevasSkippedLines.push(...skippedLines.map((s) => ({ ...s, fuente: file.name })));
        nuevasFuentes.push({ label: `${file.name} (${rows.length} líneas)`, n: rows.length });
      } catch (err) {
        erroresArchivo.push(`${file.name}: ${err.message}`);
      }
    }

    if (nuevasFilas.length > 0) {
      setParsedRows((prev) => (prev ? [...prev, ...nuevasFilas] : nuevasFilas));
      setSkippedCount((prev) => prev + totalSkipped);
      setSkippedLinesList((prev) => [...prev, ...nuevasSkippedLines]);
      setVentasFuentes((prev) => [...prev, ...nuevasFuentes]);
      setFileName(files[files.length - 1].name);
      setRawInput("");
    }
    if (erroresArchivo.length > 0) {
      setFileError(erroresArchivo.join(" · "));
    }
    e.target.value = "";
  };

  const handleVaciarVentas = () => {
    setParsedRows(null);
    setSkippedCount(0);
    setSkippedLinesList([]);
    setFileName("");
    setFileError("");
    setVentasFuentes([]);
    setExpandedKey(null);
  };

  const handleInventarioUpload = async (e, cual) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    const setFiles = cual === "inicial" ? setInvInicialFiles : setInvFinalFiles;
    const setErr = cual === "inicial" ? setInvInicialError : setInvFinalError;
    setErr("");

    const nuevos = [];
    const errores = [];
    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array", cellDates: true });
        const sheets = parseInventarioWorkbook(wb);
        if (sheets.length === 0) {
          errores.push(`${file.name}: no reconozco el formato (¿es la plantilla de INVENTARIO_FORMATO.xlsx?)`);
          continue;
        }
        nuevos.push({ fileName: file.name, sheets });
      } catch (err) {
        errores.push(`${file.name}: ${err.message}`);
      }
    }
    if (nuevos.length > 0) setFiles((prev) => [...prev, ...nuevos]);
    if (errores.length > 0) setErr(errores.join(" · "));
    e.target.value = "";
  };

  const handleCargarGoogleSheet = async (cual) => {
    const { tienda, semana } = gsheetSel[cual];
    if (!tienda || !semana) return;
    setGsheetLoading((s) => ({ ...s, [cual]: true }));
    setGsheetError((s) => ({ ...s, [cual]: "" }));
    try {
      const parsed = await fetchInventarioSemanalGoogleSheet(tienda, semana);
      const setFiles = cual === "inicial" ? setInvInicialFiles : setInvFinalFiles;
      const fileName = `${tienda} — ${semana} (Google Sheets)`;
      setFiles((prev) => [...prev.filter((f) => f.fileName !== fileName), { fileName, sheets: [{ sheetName: semana, parsed }] }]);
    } catch (err) {
      setGsheetError((s) => ({ ...s, [cual]: `No se ha podido cargar ${tienda} / ${semana}: ${err.message}` }));
    }
    setGsheetLoading((s) => ({ ...s, [cual]: false }));
  };

  const handleRemoveInventarioFile = (cual, fileName) => {
    const setFiles = cual === "inicial" ? setInvInicialFiles : setInvFinalFiles;
    setFiles((prev) => prev.filter((f) => f.fileName !== fileName));
  };

  const handleFacturaUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setFacturaError("");
    setFacturaLoading(true);
    const nuevas = [];
    const errores = [];
    for (const file of files) {
      try {
        const text = await extractPdfText(file);
        const parsed = parseFacturaText(text);
        nuevas.push({ fileName: file.name, ...parsed });
      } catch (err) {
        errores.push(`${file.name}: ${err.message}`);
      }
    }
    if (nuevas.length > 0) setFacturaPreviews((prev) => [...prev, ...nuevas]);
    if (errores.length > 0) setFacturaError(errores.join(" · "));
    setFacturaLoading(false);
    e.target.value = "";
  };

  const handleConfirmarFactura = (idx) => {
    const f = facturaPreviews[idx];
    setCompras((c) => ({
      ...c,
      litrosHelado: c.litrosHelado + f.totales.litrosHelado,
      macarons: c.macarons + f.totales.macarons,
      macaronsGrandiosos: c.macaronsGrandiosos + f.totales.macaronsGrandiosos,
      gofres: c.gofres + f.totales.gofres,
      creps: c.creps + f.totales.creps,
    }));
    setFacturasConfirmadas((prev) => [...prev, f]);
    setFacturaPreviews((prev) => prev.filter((_, i) => i !== idx));
  };

  const handleDescartarFacturaPreview = (idx) => {
    setFacturaPreviews((prev) => prev.filter((_, i) => i !== idx));
  };

  const handleQuitarFacturaConfirmada = (idx) => {
    const f = facturasConfirmadas[idx];
    setCompras((c) => ({
      ...c,
      litrosHelado: c.litrosHelado - f.totales.litrosHelado,
      macarons: c.macarons - f.totales.macarons,
      macaronsGrandiosos: c.macaronsGrandiosos - f.totales.macaronsGrandiosos,
      gofres: c.gofres - f.totales.gofres,
      creps: c.creps - f.totales.creps,
    }));
    setFacturasConfirmadas((prev) => prev.filter((_, i) => i !== idx));
  };

  const handleVaciarCosteReal = () => {
    setInvInicialFiles([]);
    setInvFinalFiles([]);
    setInvInicialManual({ totalLitros: 0, macarons: 0, gofres: 0, creps: 0, macaronsGrandiosos: 0 });
    setInvFinalManual({ totalLitros: 0, macarons: 0, gofres: 0, creps: 0, macaronsGrandiosos: 0 });
    setCompras({ litrosHelado: 0, macarons: 0, gofres: 0, creps: 0, macaronsGrandiosos: 0 });
    setFacturasConfirmadas([]);
    setFacturaPreviews([]);
    setInvInicialError("");
    setInvFinalError("");
  };

  const handleManualMap = async (productoOriginal, escandalloElegido) => {
    const next = { ...customAliases, [normalize(productoOriginal)]: escandalloElegido };
    await persistAliases(next);
    setSaveNote(`Guardado: "${productoOriginal}" → "${escandalloElegido}"`);
    setTimeout(() => setSaveNote(""), 2500);
  };

  const handleRatioEdit = async (producto, value) => {
    const n = parseFloat(value);
    const next = { ...ratioOverrides };
    if (isNaN(n)) delete next[producto];
    else next[producto] = n / 100;
    await persistOverrides(next);
  };

  const filteredEscandallos = useMemo(() => {
    const f = normalize(escandalloFilter);
    return ESCANDALLOS_BASE.filter((e) => normalize(e.producto).includes(f)).sort(
      (a, b) => a.ratio - b.ratio
    );
  }, [escandalloFilter]);

  const ratioColor = (pct) => {
    if (pct === null || pct === undefined) return "#9CA3AF";
    if (pct < 25) return "#15803D";
    if (pct < 40) return "#B45309";
    return "#B91C1C";
  };

  // Sección genérica: lista de productos que consumen una materia prima base (macarons, gofres, creps...),
  // con cada fila expandible para ver el escandallo completo del producto.
  const renderMaterialSection = (emoji, titulo, consumoTeorico, unitLabel, keyPrefix, show, setShow) => {

    return (
      <div style={{ background: "#FFFFFF", border: "1px solid #ECE4D6", borderRadius: 14, padding: 18, marginTop: 14 }}>
        <button
          onClick={() => setShow((s) => !s)}
          style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 14, fontWeight: 700, color: "#1F2937", display: "flex", alignItems: "center", gap: 6 }}

          <span style={{ display: "inline-block", transform: show ? "rotate(90deg)" : "none", transition: "transform 0.15s" }}>›</span>
          {emoji} {titulo} — {consumoTeorico.total.toFixed(0)} {unitLabel}
        </button>
        {show && (
          <>
            {consumoTeorico.sinUnidades.length > 0 && (
              <div style={{ background: "#FEF3E7", border: "1px solid #F5D9AE", borderRadius: 10, padding: "9px 13px", fontSize: 12, marginTop: 10, color: "#92400E" }}>
                {consumoTeorico.sinUnidades.length} producto{consumoTeorico.sinUnidades.length !== 1 ? "s" : ""} ({consumoTeorico.sinUnidades.map((r) => r.producto).join(", ")}) no
                tenían columna de unidades, así que no se han podido sumar aquí.
              </div>
            )}
            <div className="il-costo-scroll" style={{ overflowX: "auto", border: "1px solid #ECE4D6", borderRadius: 10, marginTop: 10 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                <thead>
                  <tr style={{ background: "#1F2937", color: "white", textAlign: "left" }}>
                    <th style={{ padding: "8px 12px", fontWeight: 600 }}>Producto</th>
                    <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>Ud. vendidas</th>
                    <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>× base/ud.</th>
                    <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>{unitLabel} consumidos</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => {
                    const mult = r[`${keyPrefix}Ud`];
                    const total = mult * r.unidades;
                    const key = `${keyPrefix}-${i}-${r.producto}`;
                    const isOpen = expandedKey === key;
                    return (
                      <React.Fragment key={key}>
                        <tr
                          onClick={() => setExpandedKey(isOpen ? null : key)}
                          style={{ background: isOpen ? "#FEF3E7" : i % 2 ? "#FBF8F2" : "white", borderTop: "1px solid #F1EBDD", cursor: "pointer" }}
                        >
                          <td style={{ padding: "7px 12px" }}>
                            <span style={{ display: "inline-block", width: 12, transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s", color: "#B45309" }}>›</span>
                            {" "}{r.producto}
                          </td>
                          <td style={{ padding: "7px 12px", textAlign: "right", color: "#78716C" }}>{fmtNum(r.unidades)}</td>
                          <td style={{ padding: "7px 12px", textAlign: "right", color: "#78716C" }}>{mult}</td>
                          <td style={{ padding: "7px 12px", textAlign: "right", fontWeight: 600 }}>{fmtNum(total)}</td>
                        </tr>
                        {isOpen && <IngredientBreakdown detalle={resolveDetalle(r.producto)} colSpan={4} />}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </>
        )}
      </div>
    );
  };

  return (
    <div style={{ background: "#FAF6EF", minHeight: "100%", fontFamily: "'Inter', sans-serif", color: "#1F2937" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
        .il-costo-display { font-family: 'Fraunces', serif; }
        .il-costo-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .il-costo-scroll::-webkit-scrollbar-thumb { background: #E7DFD2; border-radius: 4px; }
        input[type="text"]:focus, textarea:focus, select:focus { outline: 2px solid #B45309; outline-offset: 1px; }
      `}</style>

      <div style={{ maxWidth: 960, margin: "0 auto", padding: "36px 20px 60px" }}>
        {/* Header */}
        <div style={{ marginBottom: 28 }}>
          <div style={{ fontSize: 11, letterSpacing: "0.14em", fontWeight: 600, color: "#B45309", textTransform: "uppercase" }}>
            Amorino · herramienta interna
          </div>
          <h1 className="il-costo-display" style={{ fontSize: 42, fontWeight: 700, margin: "6px 0 8px", color: "#1F2937", lineHeight: 1.05 }}>
            Il Costo
          </h1>
          <p style={{ fontSize: 15, color: "#57534E", maxWidth: 560, lineHeight: 1.5, margin: 0 }}>
            Pega las ventas del mes (producto, unidades, facturación) y calcula al instante cuál
            debería ser tu coste de producto según los escandallos.
          </p>
        </div>

        {/* Input */}
        <div style={{ background: "#FFFFFF", border: "1px solid #ECE4D6", borderRadius: 14, padding: 20, marginBottom: 24, boxShadow: "0 1px 2px rgba(0,0,0,0.03)" }}>
          <div style={{ display: "flex", gap: 12, marginBottom: 16, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 200px" }}>
              <label style={{ display: "block", fontWeight: 600, fontSize: 13, marginBottom: 5 }}>
                Tienda <span style={{ color: "#B91C1C" }}>*</span>
              </label>
              <select
                value={selectedTienda}
                onChange={(e) => { setSelectedTienda(e.target.value); if (e.target.value) setTiendaWarning(false); }}
                style={{
                  width: "100%", boxSizing: "border-box", border: `1px solid ${tiendaWarning ? "#B91C1C" : "#E5E0D5"}`,
                  borderRadius: 8, padding: "9px 10px", fontSize: 13.5, background: "#FFFDF9",
                }}
              >
                <option value="">Selecciona tienda…</option>
                {TIENDAS.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div style={{ flex: "1 1 160px" }}>
              <label style={{ display: "block", fontWeight: 600, fontSize: 13, marginBottom: 5 }}>Mes (opcional)</label>
              <select
                value={selectedMes}
                onChange={(e) => setSelectedMes(e.target.value)}
                style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E5E0D5", borderRadius: 8, padding: "9px 10px", fontSize: 13.5, background: "#FFFDF9" }}
              >
                <option value="">Sin especificar</option>
                {MESES.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
          </div>
          {tiendaWarning && (
            <div style={{ fontSize: 12.5, color: "#B91C1C", marginBottom: 12 }}>
              Indica a qué tienda corresponden estos datos antes de calcular.
            </div>
          )}

          <div style={{ marginBottom: 16 }}>
            <label
              htmlFor="il-costo-file-input"
              style={{
                display: "inline-flex", alignItems: "center", gap: 8, cursor: "pointer",
                background: "#FEF3E7", border: "1px solid #F5D9AE", borderRadius: 9,
                padding: "9px 16px", fontSize: 13.5, fontWeight: 600, color: "#92400E",
              }}
            >
              📄 Cargar archivo(s) .xls / .xlsx
            </label>
            <input
              id="il-costo-file-input"
              type="file"
              accept=".xls,.xlsx"
              multiple
              onChange={handleFileUpload}
              style={{ display: "none" }}
            />
            {fileName && <span style={{ marginLeft: 10, fontSize: 12.5, color: "#78716C" }}>{fileName} ✓</span>}
            {fileError && <div style={{ fontSize: 12.5, color: "#B91C1C", marginTop: 6 }}>{fileError}</div>}
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "4px 0 16px", color: "#D6CFC0" }}>
            <div style={{ flex: 1, height: 1, background: "#ECE4D6" }} />
            <span style={{ fontSize: 11.5, color: "#B0A99A" }}>o pega los datos</span>
            <div style={{ flex: 1, height: 1, background: "#ECE4D6" }} />
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
            <label style={{ fontWeight: 600, fontSize: 14 }}>Ventas del mes</label>
            <span style={{ fontSize: 12, color: "#9CA3AF" }}>
              Pega el export tal cual (Tienda, Categoría, Subcategoría, Producto, IVA, Ud., Base, Importe, Peso, Beneficio)
              o solo Producto / Unidades / Importe.
            </span>
          </div>
          <textarea
            value={rawInput}
            onChange={(e) => setRawInput(e.target.value)}
            placeholder={"Producto\tUnidades\tImporte\nCOPPA Classica\t8118\t41252,10\nAgua\t3150\t6300,00\n..."}
            rows={8}
            style={{
              width: "100%",
              boxSizing: "border-box",
              border: "1px solid #E5E0D5",
              borderRadius: 10,
              padding: "12px 14px",
              fontFamily: "monospace",
              fontSize: 13,
              resize: "vertical",
              background: "#FFFDF9",

          />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12, flexWrap: "wrap", gap: 10 }}>
            <button
              onClick={handleCalcular}

              style={{

                borderRadius: 9,
                padding: "10px 22px",
                fontSize: 14,

            >
              Calcular coste teórico

            {parsedRows && (
              <span style={{ fontSize: 12.5, color: "#78716C" }}>
                {parsedRows.length} línea{parsedRows.length !== 1 ? "s" : ""} acumulada{parsedRows.length !== 1 ? "s" : ""} en total
                {skippedCount > 0 && (
                  <>
                    {" · "}
                    <button
                      onClick={() => setShowSkippedLines((s) => !s)}
                      style={{ background: "none", border: "none", padding: 0, color: "#B45309", cursor: "pointer", fontSize: 12.5, textDecoration: "underline" }}

                      {skippedCount} ignorada{skippedCount !== 1 ? "s" : ""} (ver detalle)

          </div>

            <div className="il-costo-scroll" style={{ marginTop: 10, maxHeight: 220, overflowY: "auto", border: "1px solid #ECE4D6", borderRadius: 8 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11.5 }}>

                <tbody>
                  {skippedLinesList.map((s, i) => (
                    <tr key={i} style={{ borderTop: "1px solid #F1EBDD", background: i % 2 ? "#FBF8F2" : "white" }}>
                      <td style={{ padding: "4px 10px", fontFamily: "monospace", color: "#57534E" }}>{s.texto}</td>
                      <td style={{ padding: "4px 10px", color: "#B45309" }}>{s.motivo}</td>
                      <td style={{ padding: "4px 10px", color: "#9CA3AF" }}>{s.fuente}</td>

          {ventasFuentes.length > 0 && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid #F1EBDD" }}>
              {ventasFuentes.map((f, i) => (

              >
                Vaciar todos los datos de ventas

            </div>

        </div>

        {/* Selector de pestañas */}
        <div style={{ display: "flex", gap: 4, marginBottom: 22, borderBottom: "1px solid #ECE4D6" }}>
          {[
            ["teorico", "Coste Teórico"],
            ["real", "Coste Real"],
          ].map(([key, label]) => (
            <button
              key={key}
              onClick={() => setActiveTab(key)}
              style={{
                background: "none",
