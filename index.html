// Utilidades

const normalize = (s) =>
  (s || "")
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/["“”]/g, '"')
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();

const parseNumber = (raw) => {
  if (raw === undefined || raw === null) return null;
  let s = raw.toString().trim().replace(/[€\s]/g, "");
  if (s === "" || s === "-" ) return null;
  const hasComma = s.includes(",");
  const hasDot = s.includes(".");
  if (hasComma && hasDot) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (hasComma && !hasDot) {
    s = s.replace(",", ".");
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
};

const fmtEUR = (v) =>
  (v ?? 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const fmtNum = (v) => Math.round(v ?? 0).toLocaleString("es-ES");
const fmtPct = (v) =>
  v === null || v === undefined || isNaN(v)
    ? "—"
    : v.toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";

const HEADER_WORDS = ["producto", "articulo", "artículo", "item", "nombretienda"];

function splitLine(line) {
  if (line.includes("\t")) return line.split("\t");
  if (/ {2,}/.test(line)) return line.split(/ {2,}/);
  return line.split(",");
}

// Fila con el layout completo del export de tienda:
// NombreTienda, Categoria, SubCategoria, Producto, TipoIva, Ud, Base, Importe, Peso, Beneficio
// Acepta tanto celdas de texto (pegado) como celdas ya numéricas (lectura de Excel).
function extractFullFormatRow(cells) {
  if (!cells || cells.length < 8) return null;
  const producto = cells[3];
  if (typeof producto !== "string" || !producto.trim()) return null;
  const rawUd = cells[5];
  const rawImporte = cells[7];
  const unidades = typeof rawUd === "number" ? rawUd : parseNumber(rawUd);
  const importe = typeof rawImporte === "number" ? rawImporte : parseNumber(rawImporte);
  if (importe === null || importe < 0) return null;
  return { producto: producto.trim(), unidades, importe };
}

function parseWorkbookRows(aoa) {
  let rows = [];
  let skipped = 0;
  for (const cells of aoa) {
    const r = extractFullFormatRow(cells);
    if (r) rows.push(r);
    else skipped++;
  }
  return { rows, skipped };
}

function parseSalesInput(text) {
  const lines = text.split("\n").map((l) => l.replace(/\r/, "")).filter((l) => l.trim() !== "");
  const rows = [];
  let skipped = 0;
  for (const line of lines) {
    let cells = splitLine(line).map((c) => c.trim());

    // Formato completo del export de tienda (10 columnas)
    if (cells.length >= 9) {
      const r = extractFullFormatRow(cells);
      if (r) rows.push(r);
      else skipped++;
      continue;
    }

    // Formato simplificado: Producto, [Unidades,] Importe
    cells = cells.filter((c, i) => !(i > 0 && c === "" && cells.length > 3));
    if (cells.length < 2) { skipped++; continue; }
    if (HEADER_WORDS.some((w) => normalize(cells[0]).includes(w))) { skipped++; continue; }

    let producto, unidades = null, importe = null;
    if (cells.length >= 3) {
      producto = cells[0];
      unidades = parseNumber(cells[1]);
      importe = parseNumber(cells[cells.length - 1]);
    } else {
      producto = cells[0];
      importe = parseNumber(cells[1]);
    }
    if (!producto || importe === null || importe < 0) { skipped++; continue; }
    rows.push({ producto, unidades, importe });
  }
  return { rows, skipped };
}

// Almacenamiento persistente: localStorage del navegador (versión standalone).
// En el artefacto de Claude.ai se usa window.storage; aquí, fuera de ese
// entorno, usamos localStorage con la misma interfaz mínima que necesitamos.
// ---------------------------------------------------------------------------
const storage = {
  async get(key) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw === null ? null : { value: raw };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

function CosteTeoricoApp() {
  const [rawInput, setRawInput] = useState("");
  const [parsedRows, setParsedRows] = useState(null);
  const [skippedCount, setSkippedCount] = useState(0);
  const [selectedTienda, setSelectedTienda] = useState("");
  const [selectedMes, setSelectedMes] = useState("");
  const [tiendaWarning, setTiendaWarning] = useState(false);
  const [fileName, setFileName] = useState("");
  const [fileError, setFileError] = useState("");
  const [customAliases, setCustomAliases] = useState({});
  const [ratioOverrides, setRatioOverrides] = useState({});
  const [showEscandallos, setShowEscandallos] = useState(false);
  const [escandalloFilter, setEscandalloFilter] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [saveNote, setSaveNote] = useState("");

  // Cargar equivalencias y ajustes guardados
  useEffect(() => {
    (async () => {
      try {
        const a = await storage.get("il_costo_custom_aliases");
        if (a && a.value) setCustomAliases(JSON.parse(a.value));
      } catch (e) {}
      try {
        const r = await storage.get("il_costo_ratio_overrides");
        if (r && r.value) setRatioOverrides(JSON.parse(r.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  const persistAliases = useCallback(async (next) => {
    setCustomAliases(next);
    try {
      await storage.set("il_costo_custom_aliases", JSON.stringify(next));
    } catch (e) {}
  }, []);

  const persistOverrides = useCallback(async (next) => {
    setRatioOverrides(next);
    try {
      await storage.set("il_costo_ratio_overrides", JSON.stringify(next));
    } catch (e) {}
  }, []);

  // Índice de escandallos por nombre normalizado (con overrides de ratio aplicados)
  const escandalloIndex = useMemo(() => {
    const idx = {};
    for (const e of ESCANDALLOS_BASE) {
      const ratio = ratioOverrides[e.producto] !== undefined ? ratioOverrides[e.producto] : e.ratio;
      idx[normalize(e.producto)] = { producto: e.producto, ratio };
    }
    return idx;
  }, [ratioOverrides]);

  const resolveProduct = useCallback(
    (nombre) => {
      const n = normalize(nombre);
      if (escandalloIndex[n]) return escandalloIndex[n];
      if (customAliases[n] && escandalloIndex[normalize(customAliases[n])]) {
        return escandalloIndex[normalize(customAliases[n])];
      }
      if (ALIASES[n] && escandalloIndex[normalize(ALIASES[n])]) {
        return escandalloIndex[normalize(ALIASES[n])];
      }
      return null;
    },
    [escandalloIndex, customAliases]
  );

  // Índice de gramos de helado por producto (dato fijo, sin overrides por ahora)
  const heladoIndex = useMemo(() => {
    const idx = {};
    for (const h of GRAMOS_HELADO_BASE) {
      idx[normalize(h.producto)] = { producto: h.producto, gramos: h.gramos };
    }
    return idx;
  }, []);

  const resolveHelado = useCallback(
    (nombre) => {
      const n = normalize(nombre);
      if (heladoIndex[n]) return heladoIndex[n];
      if (ALIASES_HELADO[n] && heladoIndex[normalize(ALIASES_HELADO[n])]) {
        return heladoIndex[normalize(ALIASES_HELADO[n])];
      }
      return null;
    },
    [heladoIndex]
  );

  const results = useMemo(() => {
    if (!parsedRows) return null;
    const rows = parsedRows.map((r) => {
      const match = resolveProduct(r.producto);
      const coste = match ? r.importe * match.ratio : null;
      const heladoMatch = resolveHelado(r.producto);
      const gramosHeladoUd = heladoMatch ? heladoMatch.gramos : 0;
      const gramosHeladoTotal = heladoMatch && r.unidades !== null ? heladoMatch.gramos * r.unidades : null;
      return {
        ...r,
        match,
        ratioPct: match ? match.ratio * 100 : null,
        coste,
        heladoMatch,
        gramosHeladoUd,
        gramosHeladoTotal,
      };
    });
    rows.sort((a, b) => (b.importe || 0) - (a.importe || 0));
    const totalImporte = rows.reduce((a, r) => a + (r.importe || 0), 0);
    const matchedRows = rows.filter((r) => r.match);
    const importeConCoste = matchedRows.reduce((a, r) => a + r.importe, 0);
    const costeTotal = matchedRows.reduce((a, r) => a + r.coste, 0);
    const cobertura = totalImporte > 0 ? (importeConCoste / totalImporte) * 100 : 0;
    const ratioMedio = importeConCoste > 0 ? (costeTotal / importeConCoste) * 100 : null;
    const unmatchedCount = rows.length - matchedRows.length;

    // Litros de helado: solo se pueden sumar las líneas que tienen unidades (no basta con el importe)
    const heladoRows = rows.filter((r) => r.heladoMatch && r.gramosHeladoUd > 0);
    const heladoConUnidades = heladoRows.filter((r) => r.gramosHeladoTotal !== null);
    const heladoSinUnidades = heladoRows.filter((r) => r.gramosHeladoTotal === null);
    const gramosHeladoTotal = heladoConUnidades.reduce((a, r) => a + r.gramosHeladoTotal, 0);
    const litrosHelado = gramosHeladoTotal / 880;

    return {
      rows, totalImporte, importeConCoste, costeTotal, cobertura, ratioMedio, unmatchedCount,
      heladoRows: heladoConUnidades.sort((a, b) => b.gramosHeladoTotal - a.gramosHeladoTotal),
      heladoSinUnidades,
      gramosHeladoTotal, litrosHelado,
    };
  }, [parsedRows, resolveProduct, resolveHelado]);

  const handleCalcular = () => {
    if (!selectedTienda) {
      setTiendaWarning(true);
      return;
    }
    setTiendaWarning(false);
    setFileName("");
    setFileError("");
    const { rows, skipped } = parseSalesInput(rawInput);
    setParsedRows(rows);
    setSkippedCount(skipped);
  };

  const handleFileUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!selectedTienda) {
      setTiendaWarning(true);
      e.target.value = "";
      return;
    }
    setTiendaWarning(false);
    setFileError("");
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
      const { rows, skipped } = parseWorkbookRows(aoa);
      if (rows.length === 0) {
        setFileError("No se han encontrado filas válidas en el archivo. ¿Tiene el formato esperado (Tienda, Categoría, Subcategoría, Producto, IVA, Ud., Base, Importe, Peso, Beneficio)?");
        e.target.value = "";
        return;
      }
      setParsedRows(rows);
      setSkippedCount(skipped);
      setFileName(file.name);
      setRawInput("");
    } catch (err) {
      setFileError("No se ha podido leer el archivo: " + err.message);
    }
    e.target.value = "";
  };

  const handleManualMap = async (productoOriginal, escandalloElegido) => {
    const next = { ...customAliases, [normalize(productoOriginal)]: escandalloElegido };
    await persistAliases(next);
    setSaveNote(`Guardado: "${productoOriginal}" → "${escandalloElegido}"`);
    setTimeout(() => setSaveNote(""), 2500);
  };

  const handleRatioEdit = async (producto, value) => {
    const n = parseFloat(value);
    const next = { ...ratioOverrides };
    if (isNaN(n)) delete next[producto];
    else next[producto] = n / 100;
    await persistOverrides(next);
  };

  const filteredEscandallos = useMemo(() => {
    const f = normalize(escandalloFilter);
    return ESCANDALLOS_BASE.filter((e) => normalize(e.producto).includes(f)).sort(
      (a, b) => a.ratio - b.ratio
    );
  }, [escandalloFilter]);

  const ratioColor = (pct) => {
    if (pct === null || pct === undefined) return "#9CA3AF";
    if (pct < 25) return "#15803D";
    if (pct < 40) return "#B45309";
    return "#B91C1C";
  };

  return (
    <div style={{ background: "#FAF6EF", minHeight: "100%", fontFamily: "'Inter', sans-serif", color: "#1F2937" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
        .il-costo-display { font-family: 'Fraunces', serif; }
        .il-costo-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .il-costo-scroll::-webkit-scrollbar-thumb { background: #E7DFD2; border-radius: 4px; }
        input[type="text"]:focus, textarea:focus, select:focus { outline: 2px solid #B45309; outline-offset: 1px; }
      `}</style>

      <div style={{ maxWidth: 960, margin: "0 auto", padding: "36px 20px 60px" }}>
        {/* Header */}
        <div style={{ marginBottom: 28 }}>
          <div style={{ fontSize: 11, letterSpacing: "0.14em", fontWeight: 600, color: "#B45309", textTransform: "uppercase" }}>
            Amorino · herramienta interna
          </div>
          <h1 className="il-costo-display" style={{ fontSize: 42, fontWeight: 700, margin: "6px 0 8px", color: "#1F2937", lineHeight: 1.05 }}>
            Il Costo
          </h1>
          <p style={{ fontSize: 15, color: "#57534E", maxWidth: 560, lineHeight: 1.5, margin: 0 }}>
            Pega las ventas del mes (producto, unidades, facturación) y calcula al instante cuál
            debería ser tu coste de producto según los escandallos.
          </p>
        </div>

        {/* Input */}
        <div style={{ background: "#FFFFFF", border: "1px solid #ECE4D6", borderRadius: 14, padding: 20, marginBottom: 24, boxShadow: "0 1px 2px rgba(0,0,0,0.03)" }}>
          <div style={{ display: "flex", gap: 12, marginBottom: 16, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 200px" }}>
              <label style={{ display: "block", fontWeight: 600, fontSize: 13, marginBottom: 5 }}>
                Tienda <span style={{ color: "#B91C1C" }}>*</span>
              </label>
              <select
                value={selectedTienda}
                onChange={(e) => { setSelectedTienda(e.target.value); if (e.target.value) setTiendaWarning(false); }}
                style={{
                  width: "100%", boxSizing: "border-box", border: `1px solid ${tiendaWarning ? "#B91C1C" : "#E5E0D5"}`,
                  borderRadius: 8, padding: "9px 10px", fontSize: 13.5, background: "#FFFDF9",
                }}
              >
                <option value="">Selecciona tienda…</option>
                {TIENDAS.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div style={{ flex: "1 1 160px" }}>
              <label style={{ display: "block", fontWeight: 600, fontSize: 13, marginBottom: 5 }}>Mes (opcional)</label>
              <select
                value={selectedMes}
                onChange={(e) => setSelectedMes(e.target.value)}
                style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E5E0D5", borderRadius: 8, padding: "9px 10px", fontSize: 13.5, background: "#FFFDF9" }}
              >
                <option value="">Sin especificar</option>
                {MESES.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
          </div>
          {tiendaWarning && (
            <div style={{ fontSize: 12.5, color: "#B91C1C", marginBottom: 12 }}>
              Indica a qué tienda corresponden estos datos antes de calcular.
            </div>
          )}

          <div style={{ marginBottom: 16 }}>
            <label
              htmlFor="il-costo-file-input"
              style={{
                display: "inline-flex", alignItems: "center", gap: 8, cursor: "pointer",
                background: "#FEF3E7", border: "1px solid #F5D9AE", borderRadius: 9,
                padding: "9px 16px", fontSize: 13.5, fontWeight: 600, color: "#92400E",
              }}
            >
              📄 Cargar archivo .xls / .xlsx
            </label>
            <input
              id="il-costo-file-input"
              type="file"
              accept=".xls,.xlsx"
              onChange={handleFileUpload}
              style={{ display: "none" }}
            />
            {fileName && <span style={{ marginLeft: 10, fontSize: 12.5, color: "#78716C" }}>{fileName} ✓</span>}
            {fileError && <div style={{ fontSize: 12.5, color: "#B91C1C", marginTop: 6 }}>{fileError}</div>}
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "4px 0 16px", color: "#D6CFC0" }}>
            <div style={{ flex: 1, height: 1, background: "#ECE4D6" }} />
            <span style={{ fontSize: 11.5, color: "#B0A99A" }}>o pega los datos</span>
            <div style={{ flex: 1, height: 1, background: "#ECE4D6" }} />
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
            <label style={{ fontWeight: 600, fontSize: 14 }}>Ventas del mes</label>
            <span style={{ fontSize: 12, color: "#9CA3AF" }}>
              Pega el export tal cual (Tienda, Categoría, Subcategoría, Producto, IVA, Ud., Base, Importe, Peso, Beneficio)
              o solo Producto / Unidades / Importe.
            </span>
          </div>
          <textarea
            value={rawInput}
            onChange={(e) => setRawInput(e.target.value)}
            placeholder={"Producto\tUnidades\tImporte\nCOPPA Classica\t8118\t41252,10\nAgua\t3150\t6300,00\n..."}
            rows={8}
            style={{
              width: "100%",
              boxSizing: "border-box",
              border: "1px solid #E5E0D5",
              borderRadius: 10,
              padding: "12px 14px",
              fontFamily: "monospace",
              fontSize: 13,
              resize: "vertical",
              background: "#FFFDF9",
            }}
          />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
            <button
              onClick={handleCalcular}
              disabled={!rawInput.trim()}
              style={{
                background: rawInput.trim() ? "#1F2937" : "#D1D5DB",
                color: "white",
                border: "none",
                borderRadius: 9,
                padding: "10px 22px",
                fontSize: 14,
                fontWeight: 600,
                cursor: rawInput.trim() ? "pointer" : "default",
              }}
            >
              Calcular coste teórico
            </button>
            {parsedRows && (
              <span style={{ fontSize: 12.5, color: "#78716C" }}>
                {parsedRows.length} línea{parsedRows.length !== 1 ? "s" : ""} interpretada{parsedRows.length !== 1 ? "s" : ""}
                {skippedCount > 0 ? ` · ${skippedCount} ignorada${skippedCount !== 1 ? "s" : ""} (cabecera/devoluciones)` : ""}
              </span>
            )}
          </div>
        </div>

        {/* Resultados */}
        {results && (
          <>
            <div style={{ fontSize: 13, color: "#78716C", marginBottom: 10 }}>
              Resultados — <strong style={{ color: "#1F2937" }}>{selectedTienda}</strong>
              {selectedMes ? <> · {selectedMes}</> : null}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 22 }}>
              {[
                ["Facturación total", fmtEUR(results.totalImporte)],
                ["Coste teórico", fmtEUR(results.costeTotal)],
                ["Ratio de coste medio", fmtPct(results.ratioMedio)],
                ["Cobertura de escandallo", fmtPct(results.cobertura)],
              ].map(([label, val]) => (
                <div key={label} style={{ background: "#1F2937", borderRadius: 12, padding: "16px 16px 14px", color: "white" }}>
                  <div className="il-costo-display" style={{ fontSize: 22, fontWeight: 700 }}>{val}</div>
                  <div style={{ fontSize: 11.5, color: "#C9CDD3", marginTop: 3 }}>{label}</div>
                </div>
              ))}
            </div>

            {results.unmatchedCount > 0 && (
              <div style={{ background: "#FEF3E7", border: "1px solid #F5D9AE", borderRadius: 10, padding: "10px 14px", fontSize: 13, marginBottom: 16, color: "#92400E" }}>
                {results.unmatchedCount} producto{results.unmatchedCount !== 1 ? "s" : ""} sin equivalencia en el escandallo — asígnala manualmente en la tabla y se recordará la próxima vez.
              </div>
            )}
            {saveNote && (
              <div style={{ fontSize: 12.5, color: "#15803D", marginBottom: 10 }}>{saveNote}</div>
            )}

            <div style={{ background: "#FFFFFF", border: "1px solid #ECE4D6", borderRadius: 14, overflow: "hidden", marginBottom: 28 }}>
              <div className="il-costo-scroll" style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr style={{ background: "#1F2937", color: "white", textAlign: "left" }}>
                      <th style={{ padding: "10px 14px", fontWeight: 600 }}>Producto</th>
                      <th style={{ padding: "10px 14px", fontWeight: 600, textAlign: "right" }}>Ud.</th>
                      <th style={{ padding: "10px 14px", fontWeight: 600, textAlign: "right" }}>Facturación</th>
                      <th style={{ padding: "10px 14px", fontWeight: 600, textAlign: "right" }}>Ratio coste</th>
                      <th style={{ padding: "10px 14px", fontWeight: 600, textAlign: "right" }}>Coste teórico</th>
                    </tr>
                  </thead>
                  <tbody>
                    {results.rows.map((r, i) => (
                      <tr key={i} style={{ background: i % 2 ? "#FBF8F2" : "white", borderTop: "1px solid #F1EBDD" }}>
                        <td style={{ padding: "9px 14px" }}>{r.producto}</td>
                        <td style={{ padding: "9px 14px", textAlign: "right", color: "#78716C" }}>
                          {r.unidades !== null ? fmtNum(r.unidades) : "—"}
                        </td>
                        <td style={{ padding: "9px 14px", textAlign: "right" }}>{fmtEUR(r.importe)}</td>
                        <td style={{ padding: "9px 14px", textAlign: "right" }}>
                          {r.match ? (
                            <span style={{ color: ratioColor(r.ratioPct), fontWeight: 600 }}>{fmtPct(r.ratioPct)}</span>
                          ) : (
                            <select
                              defaultValue=""
                              onChange={(e) => e.target.value && handleManualMap(r.producto, e.target.value)}
                              style={{ fontSize: 12, border: "1px solid #F5D9AE", borderRadius: 6, padding: "4px 6px", color: "#92400E", background: "#FEF3E7" }}
                            >
                              <option value="" disabled>Sin equivalencia — elegir…</option>
                              {ESCANDALLOS_BASE.map((e) => (
                                <option key={e.producto} value={e.producto}>{e.producto}</option>
                              ))}
                            </select>
                          )}
                        </td>
                        <td style={{ padding: "9px 14px", textAlign: "right", fontWeight: 600 }}>
                          {r.coste !== null ? fmtEUR(r.coste) : "—"}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Litros de helado */}
            <div style={{ background: "#FFFFFF", border: "1px solid #ECE4D6", borderRadius: 14, padding: 20, marginBottom: 28 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
                <span style={{ fontSize: 20 }}>🍦</span>
                <span style={{ fontWeight: 700, fontSize: 15 }}>Litros de helado vendidos</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 14 }}>
                <div style={{ background: "#FEF3E7", borderRadius: 12, padding: "16px 16px 14px" }}>
                  <div className="il-costo-display" style={{ fontSize: 22, fontWeight: 700, color: "#92400E" }}>
                    {results.litrosHelado.toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} L
                  </div>
                  <div style={{ fontSize: 11.5, color: "#92400E", marginTop: 3 }}>Litros de helado (÷ 880 g/L)</div>
                </div>
                <div style={{ background: "#FEF3E7", borderRadius: 12, padding: "16px 16px 14px" }}>
                  <div className="il-costo-display" style={{ fontSize: 22, fontWeight: 700, color: "#92400E" }}>
                    {fmtNum(results.gramosHeladoTotal)} g
                  </div>
                  <div style={{ fontSize: 11.5, color: "#92400E", marginTop: 3 }}>Gramos de helado totales</div>
                </div>
              </div>

              {results.heladoSinUnidades.length > 0 && (
                <div style={{ background: "#FEF3E7", border: "1px solid #F5D9AE", borderRadius: 10, padding: "9px 13px", fontSize: 12.5, marginBottom: 14, color: "#92400E" }}>
                  {results.heladoSinUnidades.length} producto{results.heladoSinUnidades.length !== 1 ? "s" : ""} con helado (
                  {results.heladoSinUnidades.map((r) => r.producto).join(", ")}) no tenían columna de <b>unidades</b> en los
                  datos pegados/importados, así que no se han podido sumar a los litros — el cálculo de coste no se ve afectado, solo el de helado.
                </div>
              )}

              <p style={{ fontSize: 12, color: "#9CA3AF", marginBottom: 10 }}>
                Solo se cuentan los productos con gramaje de helado documentado en el escandallo (36 referencias:
                conos, coppas, gofres/creps/brioches "con helado", bebidas con gelato, affogati, coppa gourmet y
                los formatos para llevar). El resto de productos (café, toppings sueltos, macarons, bollería…)
                cuentan como 0 g — no llevan helado.
              </p>

              {results.heladoRows.length > 0 && (
                <div className="il-costo-scroll" style={{ overflowX: "auto", border: "1px solid #ECE4D6", borderRadius: 10 }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                    <thead>
                      <tr style={{ background: "#1F2937", color: "white", textAlign: "left" }}>
                        <th style={{ padding: "8px 12px", fontWeight: 600 }}>Producto</th>
                        <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>Ud.</th>
                        <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>g helado / ud.</th>
                        <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>Total gramos</th>
                      </tr>
                    </thead>
                    <tbody>
                      {results.heladoRows.map((r, i) => (
                        <tr key={i} style={{ background: i % 2 ? "#FBF8F2" : "white", borderTop: "1px solid #F1EBDD" }}>
                          <td style={{ padding: "7px 12px" }}>{r.producto}</td>
                          <td style={{ padding: "7px 12px", textAlign: "right", color: "#78716C" }}>{fmtNum(r.unidades)}</td>
                          <td style={{ padding: "7px 12px", textAlign: "right", color: "#78716C" }}>{fmtNum(r.gramosHeladoUd)}</td>
                          <td style={{ padding: "7px 12px", textAlign: "right", fontWeight: 600 }}>{fmtNum(r.gramosHeladoTotal)} g</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </>
        )}

        {/* Base de escandallos */}
        <div style={{ borderTop: "1px solid #ECE4D6", paddingTop: 18 }}>
          <button
            onClick={() => setShowEscandallos((s) => !s)}
            style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 14, fontWeight: 600, color: "#1F2937", display: "flex", alignItems: "center", gap: 6 }}
          >
            <span style={{ display: "inline-block", transform: showEscandallos ? "rotate(90deg)" : "none", transition: "transform 0.15s" }}>›</span>
            Base de escandallos ({ESCANDALLOS_BASE.length} productos)
          </button>
          {showEscandallos && (
            <div style={{ marginTop: 14 }}>
              <input
                type="text"
                placeholder="Buscar producto…"
                value={escandalloFilter}
                onChange={(e) => setEscandalloFilter(e.target.value)}
                style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E5E0D5", borderRadius: 8, padding: "8px 12px", fontSize: 13, marginBottom: 12, background: "#FFFDF9" }}
              />
              <p style={{ fontSize: 12, color: "#9CA3AF", marginBottom: 10 }}>
                Puedes ajustar un ratio manualmente (%) si ha cambiado el coste de una receta — se guarda para próximas veces.
              </p>
              <div className="il-costo-scroll" style={{ maxHeight: 320, overflowY: "auto", border: "1px solid #ECE4D6", borderRadius: 10 }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                  <tbody>
                    {filteredEscandallos.map((e) => {
                      const current = ratioOverrides[e.producto] !== undefined ? ratioOverrides[e.producto] : e.ratio;
                      const isOverridden = ratioOverrides[e.producto] !== undefined;
                      return (
                        <tr key={e.producto} style={{ borderBottom: "1px solid #F1EBDD" }}>
                          <td style={{ padding: "7px 12px" }}>{e.producto}</td>
                          <td style={{ padding: "7px 12px", textAlign: "right", width: 110 }}>
                            <input
                              type="text"
                              defaultValue={(current * 100).toFixed(2)}
                              onBlur={(ev) => handleRatioEdit(e.producto, ev.target.value)}
                              style={{
                                width: 64,
                                textAlign: "right",
                                border: `1px solid ${isOverridden ? "#B45309" : "#E5E0D5"}`,
                                borderRadius: 6,
                                padding: "3px 6px",
                                fontSize: 12,
                                color: isOverridden ? "#B45309" : "#1F2937",
                                fontWeight: isOverridden ? 700 : 400,
                              }}
                            />
                            <span style={{ marginLeft: 3, color: "#9CA3AF" }}>%</span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>

        <p style={{ fontSize: 11.5, color: "#B0A99A", marginTop: 32, lineHeight: 1.5 }}>
          El coste teórico se calcula como facturación × ratio de coste de escandallo, producto a producto.
          Los nombres se cruzan de forma flexible (sin distinguir mayúsculas/acentos) y con las equivalencias
          confirmadas del análisis 2025. Las equivalencias manuales y ajustes de ratio que hagas aquí se
          guardan en este dispositivo para la próxima vez que abras la herramienta.
        </p>
      </div>
    </div>
  );
}

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(React.StrictMode, null, React.createElement(CosteTeoricoApp))
      );
    </script>
  </body>
</html>
