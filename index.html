            {costeReal ? (
              <>
                <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 12 }}>Real vs. Teórico — de golpe</div>
                <div style={{ background: "#FFFFFF", border: "1px solid #ECE4D6", borderRadius: 14, overflow: "hidden", marginBottom: 10 }}>
                  <div className="il-costo-scroll" style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                    <thead>
                      <tr style={{ background: "#1F2937", color: "white", textAlign: "left" }}>
                        <th rowSpan={2} style={{ padding: "10px 14px", fontWeight: 600, verticalAlign: "bottom" }}>Materia prima</th>
                        <th rowSpan={2} style={{ padding: "10px 14px", fontWeight: 600, textAlign: "right", verticalAlign: "bottom" }}>Consumo teórico</th>
                        <th rowSpan={2} style={{ padding: "10px 14px", fontWeight: 600, textAlign: "right", verticalAlign: "bottom" }}>Consumo real</th>
                        <th rowSpan={2} style={{ padding: "10px 14px", fontWeight: 600, textAlign: "right", verticalAlign: "bottom" }}>Diferencia</th>
                        <th colSpan={3} style={{ padding: "6px 14px", fontWeight: 600, textAlign: "center", borderBottom: "1px solid #374151" }}>Real, valorado en €</th>
                        <th colSpan={3} style={{ padding: "6px 14px", fontWeight: 600, textAlign: "center", borderBottom: "1px solid #374151" }}>Teórico, valorado en €</th>
                      </tr>
                      <tr style={{ background: "#1F2937", color: "white", textAlign: "right" }}>
                        <th style={{ padding: "6px 14px", fontWeight: 600 }}>€</th>
                        <th style={{ padding: "6px 14px", fontWeight: 600 }}>% s/ familia</th>
                        <th style={{ padding: "6px 14px", fontWeight: 600 }}>% s/ global</th>
                        <th style={{ padding: "6px 14px", fontWeight: 600 }}>€</th>
                        <th style={{ padding: "6px 14px", fontWeight: 600 }}>% s/ familia</th>
                        <th style={{ padding: "6px 14px", fontWeight: 600 }}>% s/ global</th>
                      </tr>
                    </thead>
                    <tbody>
                      {[
                        ["🍦 Helado", costeReal.litros, "L", 1],
                        ["🍬 Macarons", costeReal.macarons, "ud.", 0],
                        ["🍬 Macarons Grandiosos", costeReal.macaronsGrandiosos, "ud.", 0],
                        ["🧇 Gofres", costeReal.gofres, "ud.", 0],
                        ["🥞 Creps", costeReal.creps, "ud.", 0],
                      ].map(([label, c, unit, dec], i) => {
                        const overConsumption = c.delta > 0;
                        const deltaColor = Math.abs(c.delta) < 0.001 ? "#78716C" : overConsumption ? "#B91C1C" : "#1D4ED8";
                        return (
                          <tr key={label} style={{ background: i % 2 ? "#FBF8F2" : "white", borderTop: "1px solid #F1EBDD" }}>
                            <td style={{ padding: "10px 14px", fontWeight: 600 }}>{label}</td>
                            <td style={{ padding: "10px 14px", textAlign: "right" }}>{c.teorico.toFixed(dec)} {unit}</td>
                            <td style={{ padding: "10px 14px", textAlign: "right" }}>{c.real.toFixed(dec)} {unit}</td>
                            <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 700, color: deltaColor }}>
                              {c.delta >= 0 ? "+" : ""}{c.delta.toFixed(dec)} {unit}
                              {c.deltaPct !== null && (
                                <span style={{ fontWeight: 400, fontSize: 11.5, marginLeft: 4 }}>
                                  ({c.deltaPct >= 0 ? "+" : ""}{c.deltaPct.toFixed(1)}%)
                                </span>
                              )}
                            </td>
                            <td style={{ padding: "10px 14px", textAlign: "right" }}>{fmtEUR(c.consumoRealEuros)}</td>
                            <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600 }}>{fmtPct(c.pctSobreVentaFamilia)}</td>
                            <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600 }}>{fmtPct(c.pctSobreVentaGlobal)}</td>
                            <td style={{ padding: "10px 14px", textAlign: "right", color: "#78716C" }}>{fmtEUR(c.consumoTeoricoEuros)}</td>
                            <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: "#78716C" }}>{fmtPct(c.pctTeoricoSobreVentaFamilia)}</td>
                            <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: "#78716C" }}>{fmtPct(c.pctTeoricoSobreVentaGlobal)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  </div>
                </div>
                <p style={{ fontSize: 11.5, color: "#9CA3AF", marginBottom: 6 }}>
                  Precio de compra usado para valorar en €: helado {fmtEUR(PRECIO_UNITARIO.litros)}/L · macaron{" "}
                  {fmtEUR(PRECIO_UNITARIO.macarons)} · macaron grandioso {fmtEUR(PRECIO_UNITARIO.macaronsGrandiosos)} ·
                  gofre {fmtEUR(PRECIO_UNITARIO.gofres)} · crep {fmtEUR(PRECIO_UNITARIO.creps)}.
                </p>
                <p style={{ fontSize: 11.5, color: "#9CA3AF", marginBottom: 6 }}>
                  <b>% s/ familia (real)</b> = (Valor inicial del stock + Valor de la compra del stock − Valor
                  final del stock) ÷ Venta NETA de esa familia en el periodo ({fmtEUR(results.totalImporte)} es
                  la venta neta global; cada familia tiene la suya, indicada en la sección de imputación/consumo
                  correspondiente). <b>% s/ global</b> usa el mismo numerador, pero dividido entre la venta NETA
                  total del periodo en vez de la de la familia. Las columnas "Teórico" repiten exactamente los
                  mismos dos cocientes pero usando el consumo teórico (el que deberían haber generado las ventas)
                  en vez del real, para poder comparar ambos de un vistazo.
                </p>
                <p style={{ fontSize: 12, color: "#9CA3AF", marginBottom: 22 }}>
                  <span style={{ color: "#B91C1C", fontWeight: 700 }}>Rojo</span> = has consumido más materia prima de la que las
                  ventas justifican (posible merma, desperdicio o error de inventario/compras). {" "}
                  <span style={{ color: "#1D4ED8", fontWeight: 700 }}>Azul</span> = has consumido menos de lo esperado
                  (revisa si falta algún registro de compra, o si el inventario está bien contado).
                </p>
              </>
            ) : (
              <p style={{ fontSize: 13, color: "#9CA3AF", marginBottom: 22 }}>
                Sube los dos inventarios (inicial y final) para ver la comparación real vs. teórico.
              </p>
            )}

            {/* Imputación de facturación a helado (transparencia) */}
            <div style={{ background: "#FFFFFF", border: "1px solid #ECE4D6", borderRadius: 14, padding: 18 }}>
              <button
                onClick={() => setShowImputacion((s) => !s)}
                style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 14, fontWeight: 700, color: "#1F2937", display: "flex", alignItems: "center", gap: 6 }}
              >
                <span style={{ display: "inline-block", transform: showImputacion ? "rotate(90deg)" : "none", transition: "transform 0.15s" }}>›</span>
                🍦 Imputación de facturación a helado — {fmtEUR(results.totalImputadoHelado)}
              </button>
              {showImputacion && (
                <>
                  <p style={{ fontSize: 12, color: "#9CA3AF", margin: "10px 0" }}>
                    Para cada producto que lleva helado, esta es la proporción de su coste que corresponde al
                    helado (según el escandallo), aplicada a la facturación real del producto en el periodo.
                    Es la lista que pediste para poder revisar cada imputación.
                  </p>
                  <div className="il-costo-scroll" style={{ overflowX: "auto", border: "1px solid #ECE4D6", borderRadius: 10 }}>
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                      <thead>
                        <tr style={{ background: "#1F2937", color: "white", textAlign: "left" }}>
                          <th style={{ padding: "8px 12px", fontWeight: 600 }}>Producto</th>
                          <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>% coste = helado</th>
                          <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>Facturación</th>
                          <th style={{ padding: "8px 12px", fontWeight: 600, textAlign: "right" }}>€ imputados a helado</th>
                        </tr>
                      </thead>
                      <tbody>
                        {results.imputacionRows.map((r, i) => {
                          const key = `helado-${i}-${r.producto}`;
                          const isOpen = expandedKey === key;
                          return (
                            <React.Fragment key={key}>
                              <tr
                                onClick={() => setExpandedKey(isOpen ? null : key)}
                                style={{ background: isOpen ? "#FEF3E7" : i % 2 ? "#FBF8F2" : "white", borderTop: "1px solid #F1EBDD", cursor: "pointer" }}
                              >
                                <td style={{ padding: "7px 12px" }}>
                                  <span style={{ display: "inline-block", width: 12, transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s", color: "#B45309" }}>›</span>
                                  {" "}{r.producto}
                                </td>
                                <td style={{ padding: "7px 12px", textAlign: "right", color: "#78716C" }}>{fmtPct(r.proporcionMatch.proporcion * 100)}</td>
                                <td style={{ padding: "7px 12px", textAlign: "right", color: "#78716C" }}>{fmtEUR(r.importe)}</td>
                                <td style={{ padding: "7px 12px", textAlign: "right", fontWeight: 600 }}>{fmtEUR(r.importeImputadoHelado)}</td>
                              </tr>
                              {isOpen && <IngredientBreakdown detalle={resolveDetalle(r.producto)} colSpan={4} />}
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </div>

            {renderMaterialSection("🍬", "Macarons — productos que consumen", results.consumoTeoricoMacarons, "unidades", "macarons", showMacarons, setShowMacarons)}
            {renderMaterialSection("🍬", "Macarons Grandiosos — productos que consumen", results.consumoTeoricoMacaronsGrandiosos, "unidades", "macaronsGrandiosos", showMacaronsGrandiosos, setShowMacaronsGrandiosos)}
            {renderMaterialSection("🧇", "Gofres — productos que consumen", results.consumoTeoricoGofres, "unidades", "gofres", showGofres, setShowGofres)}
            {renderMaterialSection("🥞", "Creps — productos que consumen", results.consumoTeoricoCreps, "unidades", "creps", showCreps, setShowCreps)}
          </div>
        )}

        {/* Base de escandallos */}
        <div style={{ borderTop: "1px solid #ECE4D6", paddingTop: 18 }}>
          <button
            onClick={() => setShowEscandallos((s) => !s)}
            style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 14, fontWeight: 600, color: "#1F2937", display: "flex", alignItems: "center", gap: 6 }}
          >
            <span style={{ display: "inline-block", transform: showEscandallos ? "rotate(90deg)" : "none", transition: "transform 0.15s" }}>›</span>
            Base de escandallos ({ESCANDALLOS_BASE.length} productos)
          </button>
          {showEscandallos && (
            <div style={{ marginTop: 14 }}>
              <input
                type="text"
                placeholder="Buscar producto…"
                value={escandalloFilter}
                onChange={(e) => setEscandalloFilter(e.target.value)}
                style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E5E0D5", borderRadius: 8, padding: "8px 12px", fontSize: 13, marginBottom: 12, background: "#FFFDF9" }}
              />
              <p style={{ fontSize: 12, color: "#9CA3AF", marginBottom: 10 }}>
                Puedes ajustar un ratio manualmente (%) si ha cambiado el coste de una receta — se guarda para próximas veces.
              </p>
              <div className="il-costo-scroll" style={{ maxHeight: 320, overflowY: "auto", border: "1px solid #ECE4D6", borderRadius: 10 }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                  <tbody>
                    {filteredEscandallos.map((e) => {
                      const current = ratioOverrides[e.producto] !== undefined ? ratioOverrides[e.producto] : e.ratio;
                      const isOverridden = ratioOverrides[e.producto] !== undefined;
                      return (
                        <tr key={e.producto} style={{ borderBottom: "1px solid #F1EBDD" }}>
                          <td style={{ padding: "7px 12px" }}>{e.producto}</td>
                          <td style={{ padding: "7px 12px", textAlign: "right", width: 110 }}>
                            <input
                              type="text"
                              defaultValue={(current * 100).toFixed(2)}
                              onBlur={(ev) => handleRatioEdit(e.producto, ev.target.value)}
                              style={{
                                width: 64,
                                textAlign: "right",
                                border: `1px solid ${isOverridden ? "#B45309" : "#E5E0D5"}`,
                                borderRadius: 6,
                                padding: "3px 6px",
                                fontSize: 12,
                                color: isOverridden ? "#B45309" : "#1F2937",
                                fontWeight: isOverridden ? 700 : 400,
                              }}
                            />
                            <span style={{ marginLeft: 3, color: "#9CA3AF" }}>%</span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>

        <p style={{ fontSize: 11.5, color: "#B0A99A", marginTop: 32, lineHeight: 1.5 }}>
          El coste teórico se calcula como facturación × ratio de coste de escandallo, producto a producto.
          Los nombres se cruzan de forma flexible (sin distinguir mayúsculas/acentos) y con las equivalencias
          confirmadas del análisis 2025. Las equivalencias manuales y ajustes de ratio que hagas aquí se
          guardan en este dispositivo para la próxima vez que abras la herramienta.
        </p>
        <p style={{ fontSize: 10.5, color: "#D6CFC0", marginTop: 10 }}>
          Il Costo — versión {IL_COSTO_VERSION}
        </p>
      </div>
    </div>
  );
}

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(React.StrictMode, null, React.createElement(CosteTeoricoApp))
      );
    </script>
  </body>
</html>
